comparing_literals_default_variable_without_information=[b]Problema:[/b] [newLine] Estás comparando dos valores que no cambian mientras se ejecuta tu programa. La comparación siempre resultará en %TRUEFALSE%ADDINFODICT. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿Prefieres utilizar una variable [var]%VARIABLE[/var]? Si es así, debes ir a la caja de herramientas de variables y hacer una variable [var]%VARIABLE[/var] primero. Luego intenta usar el nuevo bloque [var]%VARIABLE[/var] en tu comparación.
comparing_literals_default_without_information=[b]Problema:[/b] [newLine] Estás comparando dos textos cuyos valores no cambian durante la ejecución de tu programa. La comparación siempre resultará en %TRUEFALSE%ADDINFODICT. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Cambia la comparación por algo significativo o modifica la estructura.
comparing_literals_fix=¡Bien hecho! Has arreglado la comparación de literales.
comparing_literals_wait_false=[b]Problema:[/b] [newLine] Estás comparando dos valores que no cambian mientras se ejecuta tu programa. Tu bloque en forma de diamante siempre devolverá [FALSE]. Los bloques después del bloque espera se ejecutarán %ALWAYSNEVER. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Cambia la comparación por algo significativo o reemplaza la estructura.
comparing_literals_wait_true=[b]Problema:[/b] [newLine] Estás comparando dos valores que no cambian mientras se ejecuta tu programa. Tu bloque en forma de diamante siempre devolverá [TRUE]. Los bloques después de espera se ejecutarán %ALWAYSNEVER. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Cambia la comparación por algo significativo o reemplaza la estructura.
comparing_literals_wait_variable=[b]Problema:[/b] [newLine] Estás comparando dos valores que no cambian mientras se ejecuta tu programa. Tu bloque en forma de diamante siempre devolverá %TRUEFALSE%ADDINFODICT. En consecuencia, los bloques después del bloque espera se ejecutarán %ALWAYSNEVER. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿Prefieres utilizar una variable %VARIABLE? Si es así, debes ir a la paleta de variables y hacer una variable %VARIABLE primero. Luego, intenta usar el nuevo bloque %VARIABLE en tu comparación.
