ambiguous_custom_block_signature=[b]Problema:[/b] [newLine] Has creado varios bloques personalizados con el mismo nombre. Tu programa no puede distinguir entre los bloques individuales. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Usa siempre nombres únicos para los bloques personalizados.
ambiguous_parameter_name_unused=[b]Problema:[/b] [newLine] Scratch permite múltiples parámetros con el mismo nombre en un bloque personalizado. Sin embargo, luego no puede distinguir entre estos parámetros, lo que causa problemas en tu programa. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Utiliza siempre parámetros con nombres únicos.
ambiguous_parameter_name_used=[b]Problema:[/b] [newLine] Scratch permite múltiples parámetros con el mismo nombre en un bloque personalizado. Sin embargo, luego no puede distinguir entre estos parámetros, lo que causa problemas en tu programa. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Utiliza siempre parámetros con nombres únicos.
ask_and_answer_perfume=¡Bien hecho! Estás utilizando los bloques de pregunta y respuesta para interactuar con el usuario.
backdrop_switch=¡Muy bien! Usas el evento de cambio de fondo para iniciar diferentes scripts. Esto te permite realizar diferentes acciones dependiendo del fondo del juego.
blocking_if_else=[b]Problema:[/b] [newLine] Estás utilizando los bloques [sbi]detener [todos v][/sbi] o [sbi]detener [este programa v][/sbi] en la rama [IF] (si) y [ELSE] (entonces) de este bloque. Si lo haces así, el script terminará siempre y los bloques después de [sbi]si < > entonces[/sbi] nunca se ejecutan. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Intenta utilizar la instrucción de parada solo en una rama o elimina los bloques después de [sbi]si < > entonces[/sbi].
blocking_if_else_inside_loop=[b]Problema:[/b] [newLine] Estás utilizando los bloques [sbi]detener [todos v][/sbi] o [sbi]detener [este programa v][/sbi] en la rama [IF] (si) y [ELSE] (entonces) de este bloque. De esta manera, el script terminará siempre y las instrucciones fuera de [sbi]si < > entonces[/sbi] nunca se ejecutarán. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Intenta usar el comando de parada solo en una rama o elimina el bucle.
boolean_expression=¡Bien! Usas expresiones booleanas en tu programa.
busy_waiting_all=[b]Problema:[/b] [newLine] En tu secuencia de instrucciones, estás comprobando constantemente una condición, solo para detener todo una vez se cumpla. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Utiliza mejor el bloque [sbi]espera hasta < >[/sbi] en lugar de la combinación forever (por siempre) e if (si) para finalizar tu script cuando se cumpla la condición.
busy_waiting_clone=[b]Problema:[/b] [newLine] En tu secuencia de instrucciones, estás comprobando constantemente una condición, solo para eliminar el clon una vez que se cumpla la condición. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Mejor utiliza el bloque [sbi]espera hasta que < >[/sbi] en lugar de utilizar una combinación [sbi]por siempre[/sbi] e [sbi]si < > entonces[/sbi] para finalizar tu script cuando se cumpla la condición.
busy_waiting_script=[b]Problema:[/b] [newLine] En tu script, estás comprobando constantemente una condición, solo para detener el script una vez que se cumpla. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Utiliza mejor el bloque [sbi]espera hasta que < >[/sbi] en lugar de la combinación [sbi]por siempre[/sbi] e [sbi]si < > entonces[/sbi] para finalizar tu script cuando se cumpla la condición.
call_without_definition=[b]Problema:[/b] [newLine] Si usaste un bloque personalizado en tu programa y lo eliminaste, todavía puede haber fragmentos de código que se refieran a este bloque personalizado. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Asegúrate de eliminar todas las instancias en las que se utilizó el bloque [sbi]%BLOCKNAME[/sbi] personalizado eliminado.
clone_type_1=[b]Problema:[/b] [newLine] Hay instrucciones idénticas en varios scripts. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Un bloque personalizado podría simplificar tu código.
clone_type_2=[b]Problema:[/b] [newLine] Hay instrucciones similares en varios scripts, que solo difieren en los parámetros. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Un bloque personalizado podría simplificar tu código.
clone_type_3=[b]Problema:[/b] [newLine] Hay código similar en varios scripts. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Un bloque personalizado podría simplificar tu código.
collision=¡Bien hecho! Tu objeto muestra un cierto comportamiento (por ejemplo, cambia su apariencia o se mueve) cuando choca o toca algo.
comparing_literals_default_false=[b]Problema:[/b] [newLine] Estás comparando dos valores que no cambian mientras se ejecuta tu programa. Tu bloque en forma de diamante siempre devolverá [FALSE]. En consecuencia, tu código entre corchetes horizontales %ALWAYSNEVER se ejecuta. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Cambia la comparación por algo significativo o reemplaza la estructura.
comparing_literals_default_true=[b]Problema:[/b] [newLine] Estás comparando dos valores que no cambian mientras se ejecuta tu programa. Tu bloque en forma de diamante siempre devolverá [TRUE]. En consecuencia, tu código entre corchetes horizontales %ALWAYSNEVER se ejecuta. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Cambia la comparación por algo significativo o reemplaza la estructura.
comparing_literals_default_variable=[b]Problema:[/b] [newLine] Estás comparando dos valores que no cambian mientras se ejecuta tu programa. Tu bloque en forma de diamante siempre devolverá %TRUEFALSE%ADDINFODICT. En consecuencia, tu código entre corchetes horizontales %ALWAYSNEVER se ejecuta. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿Prefieres utilizar una variable %VARIABLE? Si es así, debe ir a la paleta de variables y hacer una variable %VARIABLE primero. Luego, intenta usar el nuevo bloque %VARIABLE en tu comparación.
comparing_literals_default_variable_exists=[b]Problema:[/b] [newLine] Estás comparando dos valores que no cambian mientras se ejecuta tu programa. Tu bloque en forma de diamante siempre devolverá %TRUEFALSE%ADDINFODICT. En consecuencia, tu código entre corchetes horizontales %ALWAYSNEVER se ejecuta. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿Prefieres utilizar un bloque para tu variable definida %VARIABLE?
comparing_literals_default_variable_exists_two=[b]Problema:[/b] [newLine] Como estás comparando dos valores que no cambian mientras se ejecuta tu programa, la comparación siempre resultará en %TRUEFALSE%ADDINFODICT. En consecuencia, tu código en el bloque [bc]%THENELSE[/bc] %ALWAYSNEVER se ejecutará. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿Prefieres utilizar una variable [var]%VARIABLE1[/var] o una variable [var]%VARIABLE2[/var] o ambas? Si es así, debe ir a la caja de herramientas de variables y usar el bloque [var]%VARIABLE1[/var] y/o [var]%VARIABLE2[/var] en tu comparación.
comparing_literals_default_variable_exists_two_without_information=[b]Problema:[/b] [newLine] Como estás comparando dos valores que no cambian mientras se ejecuta tu programa, la comparación siempre resultará en %TRUEFALSE%ADDINFODICT. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿Prefieres utilizar una variable [var]%VARIABLE1[/var] o una variable [var]%VARIABLE2[/var] o ambas? Si es así, debe ir a la caja de herramientas de variables y usar el bloque [var]%VARIABLE1[/var] y/o [var]%VARIABLE2[/var] en tu comparación.
comparing_literals_default_variable_exists_without_information=[b]Problema:[/b] [newLine] Como estás comparando dos valores que no cambian mientras se ejecuta tu programa, la comparación siempre resultará en %TRUEFALSE%ADDINFODICT. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿Prefieres utilizar un bloque para tu variable definida [var]%VARIABLE[/var]?
comparing_literals_default_variable_two=[b]Problema:[/b] [newLine] Como estás comparando dos valores que no cambian mientras se ejecuta tu programa, la comparación siempre resultará en %TRUEFALSE%ADDINFODICT. En consecuencia, tu código en el bloque [bc]%THENELSE[/bc] %ALWAYSNEVER se ejecutará. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿Prefieres utilizar una variable [var]%VARIABLE1[/var] o una variable [var]%VARIABLE2[/var] o ambas? Si es así, tienes que ir a la caja de herramientas de variables y hacer una variable [var]%VARIABLE1[/var] o una variable [var]%VARIABLE2[/var] o ambas primero. Luego intenta usar el nuevo bloque [var]%VARIABLE1[/var] y/o [var]%VARIABLE2[/var] en tu comparación.
