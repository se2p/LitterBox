comparing_literals_wait_variable_two=[b]Problema:[/b] [newLine] Como estás comparando dos valores que no cambian mientras se ejecuta tu programa, la comparación siempre resultará en %TRUEFALSE%ADDINFODICT. En consecuencia, tu código después de [sbi]espere hasta que <>[/sbi] %ALWAYSNEVER se ejecutará. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿Prefieres utilizar una variable [var]%VARIABLE1[/var] o una variable [var]%VARIABLE2[/var] o ambas? Si es así, tienes que ir a la caja de herramientas de variables y hacer una variable [var]%VARIABLE1[/var] o una variable [var]%VARIABLE2[/var] o ambas primero. Luego intenta usar el nuevo bloque [var]%VARIABLE1[/var] y/o [var]%VARIABLE2[/var] en tu comparación.
conditional_inside_loop=¡Muy bien! Compruebas continuamente las condiciones dentro de un bucle. Sabes cómo combinar importantes bloques de control y eso puede ayudarte a resolver problemas más avanzados.
controlled_broadcast_or_stop=¡Muy bien! Para tener más control sobre tu programa, compruebas continuamente ciertas condiciones antes de enviar un mensaje o detener el programa/script.
coordination=¡Genial! ¡Puedes coordinar tus scripts dentro del programa muy bien! Eso es esencial para programas más grandes.
correct_broadcast=¡Gran trabajo! Has implementado correctamente un envío de mensaje, ahora puedes coordinar fácilmente todos tus scripts.
custom_block_usage=¡Muy bien! Sabes cómo crear tu bloque personalizado y también cómo usarlo en tu programa.
custom_block_with_forever=[b]Problema:[/b] [newLine] Si un bloque personalizado contiene un bucle infinito y el bloque personalizado se usa en medio de otro script, el script nunca podrá finalizar. Un bloque forever en el bloque personalizado hace que el script que le llamó nunca pueda continuar. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Añade una condición de parada al bucle.
custom_block_with_termination=[b]Problema:[/b] [newLine] El bloque personalizado [sbi]%METHOD[/sbi] contiene un [sbi]detener [todos v][/sbi] o [sbi]eliminar este clon[/sbi] y el bloque personalizado se llama en medio de otro script, el script nunca alcanzará los bloques que siguen a la llamada de [sbi]%METHOD[/sbi]. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Elimina el [sbi]detener [todos v][/sbi] o [sbi]eliminar este clon[/sbi] en el bloque personalizado [sbi]%METHOD[/sbi] o usa un bloque [sbi]si < > entonces[/sbi] para no detener en cada ejecución.
dead_code=[b]Problema:[/b] [newLine] Tu proyecto contiene bloques inaccesibles. Eso significa que hay bloques que nunca se ejecutarán. Esto hace que el proyecto esté desordenado. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes borrar estos bloques.
delete_clone_in_loop=[b]Problema:[/b] [newLine] Tu código está eliminando el clon en la primera iteración del bucle. Esto hace que el bucle sea innecesario y solo hace que tu programa sea más difícil de leer. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes eliminar el bucle.
directed_motion=¡Súper! Activado por una pulsación de tecla, tu objeto puede moverse dirigido. Ese es un concepto importante para la mayoría de los juegos de ordenador.
double_if=[b]Problema:[/b] [newLine] Tu proyecto contiene una condición [sbi]si < > entonces[/sbi] duplicada. Esto hace que el proyecto esté desordenado. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes acortar el programa fusionando las dos sentencias [sbi]si < > entonces[/sbi] en una única sentencia condicional.
duplicate_sprite=[b]Problema:[/b] [newLine] Tu proyecto contiene varias copias exactas del mismo Sprite. Esto hace que el proyecto esté desordenado. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Considera usar la clonación en su lugar.
duplicated_script=[b]Problema:[/b] [newLine] Tu proyecto contiene un script idéntico dos veces. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Probablemente solo necesite uno de ellos y podrías eliminar la copia.
duplicated_scripts_covering=[b]Problema:[/b] [newLine] Tu proyecto contiene el mismo script dos veces. Los scripts se superponen exactamente, por lo que es posible que no te des cuenta de esto. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Probablemente solo necesites uno de ellos, y podrías eliminar todas las copias.
empty_control_body=[b]Problema:[/b] [newLine] Los corchetes horizontales de [sbi]%BLOCKNAME[/sbi] están vacíos, por lo que cuando se invoca el bloque de control no sucede nada. Esto hace que tu código sea más difícil de entender. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Considera eliminar este bloque si no lo necesitas.
empty_custom_block=[b]Problema:[/b] [newLine] Creaste un bloque personalizado [sbi]%BLOCKNAME[/sbi] que no contiene instrucciones. Cuando se invoca este bloque personalizado, no sucede nada. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Considera eliminarlo si no lo necesitas.
empty_project=[b]Problema:[/b] [newLine] Tu proyecto está completamente vacío. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Empieza agregando el primer sprite.
empty_script=[b]Problema:[/b] [newLine] Utilizas un bloque de eventos [sbi]%BLOCKNAME[/sbi] vacío , por lo que cuando ocurra el evento, no pasará nada. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Elimina este bloque de eventos o agrega bloques después del mismo.
empty_sprite=[b]Problema:[/b] [newLine] El sprite %SPRITE no contiene bloques. No puede reaccionar a ninguna entrada de usuario o interacción con sprites. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Si la intención es esa, déjalo como está. De lo contrario, debes pensar en lo que debería hacer el objeto e introducir scripts en este objeto.
endless_recursion_broadcast=[b]Problema:[/b] [newLine] Si un bloque personalizado se llama a sí mismo dentro de su cuerpo y no tiene ninguna condición para detener la recursividad, se ejecutará para siempre. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Añade una condición de terminación.
endless_recursion_procedure=[b]Problema:[/b] [newLine] Si se envía un mensaje en el mismo script en el que se recibe y el script no tiene ninguna condición para detener la recursividad, se ejecutará para siempre. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Añade una condición de terminación.
expression_as_touching_or_color=[b]Problema:[/b] [newLine] Este bloque espera un color o un sprite como parámetro y no funciona correctamente con una cadena o un número. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Usa un tipo válido.
forever_inside_if=[b]Problema:[/b] [newLine] El bucle [sbi]por siempre[/sbi] nunca se abandona. Todos los bloques dentro de este script pero fuera del bucle por siempre, incluyendo los bloques siguientes al [sbi]si < > entonces[/sbi], nunca se ejecutan. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Intenta omitir el bucle interior.
forever_inside_loop=[b]Problema:[/b] [newLine] Si dos bucles están anidados y el bucle interno es un bucle infinito, el bucle interno nunca terminará. Por lo tanto, las instrucciones después del bucle interno no se ejecutarán nunca. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Evita bucles infinitos anidados.
forever_inside_loop_fix=¡Genial! Has arreglado el bucle infinito interior.
gliding_motion=¡Súper! Activado por una pulsación de tecla, tu objeto puede hacer un movimiento de deslizamiento. Ese es un concepto importante para la mayoría de los juegos de ordenador.
hide_without_show=[b]Problema:[/b] [newLine] Tu programa usa un bloque [sbi]esconder[/sbi] sin hacer que el objeto sea visible nunca más. Esto lleva a que los cambios en el objeto no se visualicen. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Para hacer visibles estos cambios tienes que usar un bloque [sbi]mostrar[/sbi] en tu programa.
illegal_parameter_refactor=[b]Problema:[/b] [newLine] El parámetro tiene un tipo incorrecto. Al editar el bloque personalizado, el parámetro booleano se ha convirtido en un parámetro numérico o de texto. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Para arreglar esto, deshaz la edición.
immediate_delete_clone_after_broadcast=[b]Problema:[/b] [newLine] El script elimina el clon inmediatamente después del bloque [sbi]enviar (%MESSAGE v)[/sbi]. El script que maneja el mensaje para este clon no se ejecutará correctamente. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] En su lugar, es mejor usar un bloque de [sbi]enviar (%MESSAGE v) y esperar[/sbi].
immediate_stop_after_say_think=[b]Problema:[/b] [newLine] El script detiene todo inmediatamente después del bloque [bc]%SAYTHINK[/bc]. El texto nunca se llegará a mostrar. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Reemplaza el bloque [bc]%SAYTHINK[/bc] por un bloque [sbi]%SAYTHINK durante ( ) segundos[/sbi]. Para hacer que el resto del programa se detenga, puedes insertar un bloque [sbi]detener [otros programas en el objeto v][/sbi] antes del %SAYTHINK.
immediate_stop_after_say_think_multiple=[b]Problema:[/b] [newLine] El script detiene todo inmediatamente después del bloque [bc]%SAYTHINK[/bc]. El texto nunca se llegará a mostrar. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Reemplaza el bloque [bc]%SAYTHINK[/bc] por un bloque [sbi]%SAYTHINK durante ( ) segundos[/sbi]. Para hacer que el resto del programa se detenga puedes insertar un [sbi]detener [otros programas en el objeto v][/sbi] antes del %SAYTHINK. Si quieres detener todo mientras el objeto está ejecutando el bloque [sbi]%SAYTHINK ( ) durante ( ) segundos[/sbi], tienes que informar a otros objetos usando un bloque [sbi]enviar (mensaje v)[/sbi], para que puedan detener sus scripts.
inappropriate_handler_delete_clone=[b]Problema:[/b] [newLine] El script contiene un bloque de [sbi]eliminar este clon[/sbi]. Sin embargo, no se puede ejecutar porque en el controlador de eventos no está claro a qué clon te refieres. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] El script tiene que comenzar con un [sbi]al comenzar como clon[/sbi] o un [sbi]al hacer clic en este objeto[/sbi]. Otra posibilidad sería mover el bloque [sbi]eliminar este clon[/sbi] a un script que comience con uno de estos bloques.
inappropriate_intimacy=[b]Problema:[/b] [newLine] Este script accede a los atributos del objeto %SPRITE con más frecuencia que a sus propios atributos. Esto sugiere que el script podría pertenecer al otro objeto. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Mueve el script al otro objeto o reduce la dependencia.
initialisation_of_looks_sprite=¡A tope! Inicializas la apariencia de tu objeto con cada nuevo inicio de programa.
initialisation_of_looks_stage=¡A tope! Inicializas la apariencia de tu escenario con cada nuevo inicio de programa.
initialisation_of_position=¡Buen trabajo! Inicializas la ubicación de tu objeto con cada nuevo inicio de programa.
interrupted_loop_sensing=[b]Problema:[/b] [newLine] El bloque [sbi]%BLOCKNAME[/sbi] interrumpe la comprobación de la condición en el bloque [sbi]%THENELSE[/sbi]. Puede ocurrir que la condición se cumpla pero tu script no reaccione en consecuencia porque está ocupado ejecutando el bloque [sbi]%BLOCKNAME[/sbi]. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Intenta comprobar la condición en un script paralelo (esto significa en [bc]otro script[/bc]).
invalid_actor_blocks_sprite=[b]Problema:[/b] [newLine] Este bloque está diseñado solo para objetos y no funcionará en el escenario. Los bloques de movimiento, decir/pensar, disfraz, clon y mostrar/ocultar solo funcionan para objetos. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Elimina este bloque del escenario o mueve el script a un objeto donde funcionará.
invalid_actor_blocks_stage=[b]Problema:[/b] [newLine] Este bloque está diseñado solo para el escenario y no funcionará en un objeto. Los bloques relacionados con fondos solo funcionan en el escenario. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Elimina este bloque del objeto o mueve el script al escenario donde funcionará.
invalid_number_string=[b]Problema:[/b] [newLine] Estás utilizando una cadena que parece un número pero no es un número válido (por ejemplo, múltiples puntos decimales o notación científica) en un bloque que espera un número. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Utiliza un formato de número válido o verifica tu entrada.
key_set_position=[b]Problema:[/b] [newLine] Tu programa establece la posición del objeto a un cierto valor cada vez que presionas la tecla %KEY. Probablemente, intentaste mover el objeto por un cierto valor. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Usa el bloque [sbi]cambiar %XY por ( )[/sbi] para mover el objeto.
list_usage=¡Bien hecho! Puedes utilizar una lista y por lo tanto manejar conceptos importantes de colecciones en la programación.
long_script=[b]Problema:[/b] [newLine] El script que has creado es muy largo. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Divídelo en dos o más scripts más pequeños para mantener la perspectiva de lo que estás haciendo.
loop_one=[b]Problema:[/b] [newLine] Si establece el número de repeticiones de un bucle en 1, se ejecutará una sola vez. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] En ese caso, se podría eliminar el bloque de bucle y simplemente conectar los bloques que contiene.
loop_sensing=¡Muy bien! Para asegurarte de no perderte un evento, compruebas continuamente si ocurre en un bucle por siempre.
loop_zero=[b]Problema:[/b] [newLine] Si estableces el número de repeticiones de un bucle en 0, nunca se ejecutará. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] En ese caso, se podría quitar el bloque de bucle y los bloques que contiene.
matching_parameter=Sabes que un parámetro debe ser inicializado antes de usarlo.
message_as_literal=[b]Problema:[/b] [newLine] Estás usando el nombre de un mensaje como texto. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿No será que lo que quieres hacer es utilizar el mensaje [sbi]enviar (%MESSAGE v)[/sbi] o [sbi]enviar (%MESSAGE v) y esperar[/sbi] en su lugar?
message_naming=[b]Problema:[/b] [newLine] El mensaje [bc]%MESSAGE[/bc] no tiene un nombre con sentido. Estás utilizando el nombre por defecto o uno que ya está en uso seguido por un número. Esto hace que tu programa sea difícil de comprender. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Utiliza un mensaje con sentido y único.
message_never_received=[b]Problema:[/b] [newLine] El mensaje %MESSAGE enviado nunca es recibido por ningún bloque [sbi]al recibir [ v][/sbi]. De modo que no ocurrirá nada como reacción al mensaje. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Cuando un script envía un mensaje, hay que comprobar que lo reciba otro script.
message_never_received_fix=Arreglo de mensaje nunca recibido
message_never_sent=[b]Problema:[/b] [newLine] El mensaje %MESSAGE que debe recibir este bloque nunca se envía. Por tanto, este script nunca se activará. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Cuando un script espera recibir un mensaje, hay que comprobar que otro script se lo envíe.
message_never_sent_fix=Arreglo de mensaje nunca enviado
message_never_sent_say_think=[b]Problema:[/b] [newLine] El mensaje [bc]%MESSAGE[/bc] que debería recibir este bloque nunca se envía. Este script nunca se activará. Estás utilizando el mensaje como texto en un bloque [sbi]%SAYTHINK durante ( ) segundos[/sbi] para el/los sprite(s): %SPRITE. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Piensa si quieres enviar un mensaje [sbi]enviar [%MESSAGE v][/sbi] para avisarles.
message_never_sent_touching=[b]Problema:[/b] [newLine] El mensaje [bc]%MESSAGE[/bc] que debería recibir este bloque nunca se envía. Este script nunca se activará. Estás utilizando un bloque [sbi]tocando (%SPRITE v)?[/sbi] en %SPRITE. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Si quieres enviar un mensaje sobre el evento de haberse tocado a todos los sprites, debes usar un bloque de envío de mensaje [sbi]enviar (%MESSAGE v)[/sbi].
middle_man_broadcast=[b]Problema:[/b] [newLine] Usar un receptor de mensaje solo para enviar un mensaje nuevamente se considera un mal olor en el código, ya que el script es un intermediario entre el remitente original y el receptor final. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Considera cambiar el código para que el mensaje llegue al receptor final en el primer envío, y luego elimina el intermediario para que no haya código redundante.
middle_man_procedure=[b]Problema:[/b] [newLine] El uso de un bloque personalizado solo para llamar a otro bloque personalizado se considera un mal olor en el código, ya que el primer bloque personalizado es un intermediario. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Considera cambiar la llamada al primer bloque personalizado convirtiéndola en una llamada al bloque personalizado final, y luego elimina el intermediario para que no haya código redundante.
missing_ask=[b]Problema:[/b] [newLine] Tu proyecto usa el bloque [sbi]respuesta[/sbi], pero el bloque [sbi]preguntar () y esperar[/sbi] nunca se usa en el proyecto. El bloque [sbi]respuesta[/sbi] no puede devolver un valor con sentido. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Utiliza el bloque [sbi]preguntar () y esperar[/sbi] antes de la primera instancia de [sbi]respuesta[/sbi].
missing_backdrop_switch=[b]Problema:[/b] [newLine] Si el bloque [sbi]Cuando el fondo cambie a [ v][/sbi] se usa para iniciar un script y el fondo nunca cambia al fondo seleccionado, el script nunca se ejecuta. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Asegúrate de cambiar el fondo de tu proyecto.
missing_clone_call=[b]Problema:[/b] [newLine] Si el bloque [sbi]al comenzar como clon[/sbi] se usa para iniciar un script, pero el sprite nunca se clona, el evento nunca se activará y el script no se ejecutará. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Asegúrate de usar un bloque de clonación.
missing_clone_initialization=[b]Problema:[/b] [newLine] Cuando se clona un objeto, pero este no tiene secuencias de comandos iniciadas por los eventos [sbi]al comenzar como clon[/sbi] o [sbi]al hacer clic en este objeto[/sbi], los clones no realizarán ninguna acción. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Quizás quieras usar un controlador de eventos en tu proyecto. De lo contrario, puedes usar el bloque [sbi]sellar[/sbi] en la extensión del lápiz si el clon solo debe ser visible.
missing_clone_initialization_delete_clone=[b]Problema:[/b] [newLine] Cuando un sprite es clonado pero no tiene scripts iniciados por [sbi]al comenzar como clon[/sbi] o [sbi]al hacer clic en este objeto[/sbi], los clones no realizarán ninguna acción. Quizás quieras utilizar uno de estos dos controladores de eventos en tu proyecto. Además, estás utilizando un [sbi]eliminar este clon[/sbi] en un script de %SPRITE. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Considera iniciar este script con un [sbi]al comenzar como clon[/sbi] o [sbi]al hacer clic en este objeto[/sbi].
missing_clone_initialization_delete_clone_message=[b]Problema:[/b] [newLine] Cuando un sprite es clonado pero no tiene scripts iniciados por [sbi]al comenzar como clon[/sbi] o [sbi]al hacer clic en este objeto[/sbi], los clones no realizarán ninguna acción. Quizás quieras utilizar uno de estos dos controladores de eventos en tu proyecto. Además, estás utilizando un [sbi]eliminar este clon[/sbi] en un script de %SPRITE que comienza con el mensaje [bc]%MESSAGE[/bc]. Busca en el sprite %SPRITE el script que envía el mensaje [bc]%MESSAGE[/bc]. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Considera comenzar ese script con un [sbi]al comenzar como clon[/sbi] o [sbi]al hacer clic en este objeto[/sbi] en lugar de con un bloque [bc]%EVENTHANDLER[/bc].
missing_clone_initialization_delete_clone_message_multiple=[b]Problema:[/b] [newLine] Cuando un sprite es clonado pero no tiene scripts iniciados por [sbi]Cuando comienzo como un clon[/sbi] o [sbi]Cuando este sprite hace clic en los eventos[/sbi], los clones no realizarán ninguna acción. Quizás quieras utilizar uno de estos dos controladores de eventos en tu proyecto. Además, estás utilizando un [sbi]eliminar este clon[/sbi] en un script de %SPRITE que comienza con el mensaje [bc]%MESSAGE[/bc]. Busca en el sprite %SPRITE los scripts que envían el mensaje [bc]%MESSAGE[/bc]. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Considera comenzar esos scripts con un [sbi]al comenzar como clon[/sbi] o [sbi]al hacer clic en este objeto[/sbi] en lugar de con bloques [bc]%EVENTHANDLER[/bc].
missing_clone_initialization_fix=Arreglo de inicialización de clon perdida
missing_erase_all=[b]Problema:[/b] [newLine] Si un objeto usa un bloque de lápiz hacia abajo pero nunca un bloque para borrar todo, todos los dibujos de una ejecución anterior permanecen para la siguiente ejecución. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Tal vez deberías usar un bloque [sbi]detener [todos][/sbi] después de tu bloque de inicio.
missing_initialization=[b]Problema:[/b] [newLine] En este sprite, %VARIABLE no se inicializa antes de ser utilizado por primera vez. Utilizará cualquier valor que contenga al final de la última ejecución. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puede que esto no sea lo que quieras.
missing_initialization_clone=[b]Problema:[/b] [newLine] En este sprite, %VARIABLE no se inicializa antes de ser utilizado por primera vez. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Lo que puede que no sea lo que quieras.
missing_loop_mouse_position_direction=[b]Problema:[/b] [newLine] Tu código intenta girar el objeto hacia el puntero del ratón, pero solo lo hace una vez. Es probable que quieras hacer esto continuamente. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Para esto, tienes que ejecutar el cambio de dirección continuamente y no solo una vez. Tienes que envolver el bloque de dirección en un bloque [sbi]por siempre[/sbi] para este cambio continuo.
missing_loop_mouse_position_motion=[b]Problema:[/b] [newLine] Tu código intenta mover el objeto hacia la posición del ratón, pero solo lo hace una vez. Es probable que quieras hacer esto continuamente durante toda la ejecución del proyecto. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Para esto, tienes que ejecutar el movimiento continuamente y no solo una vez. Tienes que envolver el bloque de movimiento en un bloque [sbi]por siempre[/sbi] para este movimiento continuo.
missing_loop_sensing=[b]Problema:[/b] [newLine] Tu script ha de ejecutar acciones cuando ocurra un evento. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Para ello, el script ha de estar continuamente verificando si el evento ha sucedido para no perdérselo.
missing_loop_sensing_fix=Arreglo de falta de detección en bucle
missing_loop_sensing_fix_wait=Arreglo de falta de detección en bucle (espera)
missing_loop_sensing_variable=[b]Problema:[/b] [newLine] Si estás esperando a que una variable tenga un valor específico, tienes que verificar ese evento continuamente dentro de un bucle, porque si no, no te enterarás del evento. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Utiliza un bloque de repetición.
missing_pen_down=[b]Problema:[/b] [newLine] Usas el bloque [sbi]bajar lápiz[/sbi] pero nunca vuelves a levantar el lápiz, por lo que tu sprite dibujará para siempre. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Asegúrate de usar un bloque de [sbi]subir lápiz[/sbi] en el sprite.
missing_pen_up=[b]Problema:[/b] [newLine] Usas el bloque [sbi]subir lápiz[/sbi] pero tu sprite nunca ha bajado el bolígrafo antes. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Asegúrate de usar un bloque de [sbi]bajar lápiz[/sbi] si quieres dibujar algo.
missing_resource=[b]Problema:[/b] [newLine] A tu programa le falta el sonido o la imagen que estás intentando utilizar. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Seleccione otro sonido o imagen o agrega la que desees usar.
missing_termination=[b]Problema:[/b] [newLine] El bloque [sbi]repetir hasta que < >[/sbi] requiere una condición de parada. Si falta esa condición, el resultado es un bucle infinito. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Si tienes un bucle infinito no se ejecutarán los bloques posteriores.
missing_wait_until_condition=[b]Problema:[/b] [newLine] El bloque [sbi]espera hasta que < >[/sbi] requiere una condición. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Si falta esa condición, el bloque esperará eternamente y el código que lo sigue nunca se ejecutará.
mouse_follower=¡Muy bien! Tu objeto puede seguir al ratón. Ese puede ser un buen concepto para muchos juegos.
movement_in_loop=¡Bien hecho! Los movimientos de tus objetos son muy fluidos y naturales porque implementaste los movimientos en un bucle.
multiple_attribute_modifications=[b]Problema:[/b] [newLine] Hay varios cambios de la misma variable o atributo uno detrás de otro. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Podrían ser reemplazados por una única instrucción.
multiple_attribute_modifications_custom=[b]Problema:[/b] [newLine] Hay varios cambios de %VARIABLE uno detrás de otro. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Podrían ser reemplazados por una única instrucción.
multiple_attribute_modifications_saythink=[b]Problema:[/b] [newLine] Hay múltiples bloques [sbi]decir ( )[/sbi] o [sbi]pensar ( )[/sbi] seguidos sin retraso. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Solo verás el primer mensaje si usas un bloque [sbi]decir ( ) durante ( ) segundos[/sbi] o [sbi]pensar ( ) durante ( ) segundos[/sbi].
nested_conditional_checks=¡Muy bien! Usas condiciones anidadas, como bloques [sbi]si < > entonces[/sbi] anidados. Eso puede ayudarte a resolver problemas más avanzados.
nested_loops=[b]Problema:[/b] [newLine] Si se anidan dos o más bucles, a menudo se producen problemas impredecibles. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Evita hacerlo.
nested_loops_perfume=¡Bien! Has usado bucles anidados como bloques [sbi]por siempre[/sbi] y [sbi]repetir ( )[/sbi] anidados. Eso puede ayudarte a resolver problemas más avanzados.
no_working_scripts=[b]Problema:[/b] [newLine] Tu sprite solo tiene bloques de sombrero (de inicio) sueltos y otros bloques muertos. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Asegúrate de conectar los bloques de sombrero a los otros bloques para que el objeto pueda reaccionar a los eventos.
object_follower=¡Muy bien! Tu objeto puede seguir a otros objetos. Ese puede ser un buen concepto para muchos juegos.
orphaned_parameter=[b]Problema:[/b] [newLine] Si eliminas un parámetro de un bloque personalizado. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Asegúrate de eliminar el parámetro de todas las ubicaciones donde lo usaste antes.
parallelisation=¡Bien hecho! Inicias al menos dos scripts con el mismo evento. Enhorabuena, has implementado el concepto de paralelización.
parameter_as_literal=[b]Problema:[/b] [newLine] Estás usando el nombre de un parámetro como texto. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿No será que lo que quieres hacer es utilizar el bloque %VARIABLE en su lugar?
parameter_out_of_scope=[b]Problema:[/b] [newLine] Parámetro fuera de alcance. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Asegúrate de utilizar los parámetros de un bloque personalizado solo dentro de ese bloque.
floating_point_comparison=[b]Problema:[/b] [newLine] En Scratch, valores como la dirección, volumen o temporizador son números de punto flotante. Es poco probable que %COORDINATE de un objeto tenga el valor exacto de tu comparación. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] En su lugar, intenta utilizar una aproximación con [LEQ] o [GEQ].
floating_point_mouse=[b]Problema:[/b] [newLine] En Scratch, la posición del puntero del ratón se define por su esquina superior izquierda. Es poco probable que la coordenada %COORDINATE del puntero del ratón tenga el valor exacto de tu comparación. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] En su lugar, intenta utilizar una aproximación con [LEQ] o [GEQ].
pointless_timer_reset=[b]Problema:[/b] [newLine] El bloque [sbi]reiniciar cronómetro[/sbi] se utiliza, pero el valor del cronómetro [sbi](cronómetro)[/sbi] nunca se utiliza. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes eliminar el bloque.
position_equals_check=[b]Problema:[/b] [newLine] La posición de un objeto normalmente se define por su centro. Es poco probable que la coordenada %COORDINATE de un objeto tenga el valor exacto en una comparación. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] En su lugar, intenta utilizar una aproximación con [LEQ] o [GEQ].
position_equals_check_dist=[b]Problema:[/b] [newLine] La posición de un objeto normalmente se define por su centro. Es poco probable que la distancia entre dos objetos tenga el valor exacto en una comparación. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] En su lugar, intenta utilizar una aproximación con [LEQ] o [GEQ].
position_equals_check_zero_mouse=[b]Problema:[/b] [newLine] La distancia entre un sprite y el puntero del ratón generalmente se mide de centro a centro. Es poco probable que los puntos centrales del puntero del ratón y el sprite estén exactamente uno encima del otro. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Elimina la igualdad [EQ] y en su lugar usa una aproximación con [LEQ] o usa el bloque en forma de diamante [sbi]¿tocando ( v)?[/sbi].
position_equals_check_zero_sprites=[b]Problema:[/b] [newLine] La distancia entre dos sprites generalmente se mide de centro a centro. Es muy poco probable que los centros de dos sprites estén exactamente uno encima del otro. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Modifica la igualdad [EQ] y en su lugar usa una aproximación con [LEQ] o usa el bloque en forma de diamante [sbi]¿tocando ( v)?[/sbi].
recursive_cloning=[b]Problema:[/b] [newLine] Los scripts que comienzan con [sbi]al comenzar como clon[/sbi] no deberían crear clones de sí mismos. Esto podría resultar en un número infinito de clones. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Asegúrate de que los clones no se clonen a sí mismos.
redundant_assignment_always=[b]Problema:[/b] [newLine] Esta asignación no tiene efecto porque la variable o el atributo siempre se sobrescribe antes de ser utilizado. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Elimina la asignación innecesaria.
redundant_assignment_possible=[b]Problema:[/b] [newLine] Esto es posiblemente redundante porque ya existe una asignación. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Comprueba si la asignación anterior estaba destinada a ser utilizada.
same_variable_different_sprite=[b]Problema:[/b] [newLine] El mismo nombre de variable se usa en múltiples sprites. Esto puede resultar confuso. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Asegúrate de utilizar nombres únicos para tus variables.
say_sound_synchronisation=¡Súper! Para hacer que tu sprite hable, reproduces un sonido al mismo tiempo que aparece una burbuja de diálogo. Esa es una gran característica para los juegos.
sequential_actions=[b]Problema:[/b] [newLine] Tu programa contiene una secuencia de instrucciones similares repetidas que probablemente puedan acortarse mediante un bucle. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Usa un bucle [sbi]repetir ( )[/sbi].
sprite_naming=[b]Problema:[/b] [newLine] El sprite %SPRITE no tiene un nombre significativo, ya que utiliza el nombre predeterminado o uno que ya se utiliza seguido de un número. Esto hace que tu programa sea difícil de entender. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Dale al sprite un nombre significativo y único.
sprite_naming_default=[b]Problema:[/b] [newLine] El sprite %SPRITE no tiene un nombre significativo, ya que utiliza el nombre predeterminado. Esto hace que tu programa sea difícil de entender. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Dale al sprite un nombre significativo y único.
stuttering_movement=[b]Problema:[/b] [newLine] Cuando usas el evento [sbi]al presionar tecla [ v][/sbi] para el movimiento, esto podría resultar en un movimiento entrecortado. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] En este caso, es mejor usar un bucle [sbi]por siempre[/sbi] que maneje los eventos de pulsación de teclas.
stuttering_movement_fix=Arreglo de movimiento entrecortado
terminated_loop=[b]Problema:[/b] [newLine] El bucle finaliza antes de que realmente se repita (por ejemplo, mediante un bloque de parada). [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes eliminar el bucle.
timer=¡Muy bien! Usas una variable como una especie de temporizador en tu bucle. Tienes una buena comprensión de los bucles y su utilización.
type_error_comparison=[b]Problema:[/b] [newLine] Estás comparando %LEFT con %RIGHT. No se recomienda comparar %TYPE_LEFT y %TYPE_RIGHT. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Asegúrate de que ambos lados de la comparación sean del mismo tipo.
type_error_mismatch=[b]Problema:[/b] [newLine] Se esperaba un %EXPECTED aquí, pero proporcionaste el bloque %BLOCK (un %ACTUAL). [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Usa un valor del tipo %EXPECTED.
type_error=[b]Problema:[/b] [newLine] Algunas de las comparaciones comparan atributos de diferentes tipos. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Verifica las comparaciones.
type_error_weird_distance=[b]Problema:[/b] [newLine] Estás utilizando un bloque de [sbi]distancia a (v)[/sbi] en una situación donde no puedes medir la distancia. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Usa el puntero del ratón o las opciones de nombre de sprite que te da la distancia [sbi]distancia a ( v)[/sbi].
unnecessary_boolean_true=[b]Problema:[/b] [newLine] Estás comparando un bloque de sensor booleano con el valor %VALUE. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Podrías usar el bloque de sensor directamente sin comparación.
unnecessary_boolean_false=[b]Problema:[/b] [newLine] Estás comparando un bloque de sensor booleano con el valor %VALUE. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Podrías usar el bloque de sensor directamente sin comparación dentro de un bloque [sbi]no < >[/sbi].
unnecessary_glide=[b]Problema:[/b] [newLine] Estás utilizando un bloque [sbi]deslizar en ( ) seg a ( v)[/sbi]. Dado que el valor de tiempo es 0, este bloque se ejecuta inmediatamente. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes usar un bloque [sbi]ir a ( v)[/sbi] en su lugar.
unnecessary_glide_xy=[b]Problema:[/b] [newLine] Estás utilizando un bloque [sbi]deslizar en ( ) seg a x: ( ) y: ( )[/sbi]. Dado que el valor de tiempo es 0, este bloque se ejecuta inmediatamente. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes usar un bloque [sbi]ir a x: ( ) y: ( )[/sbi] en su lugar.
unnecessary_if=[b]Problema:[/b] [newLine] Estás usando dos bloques [sbi]si < > entonces[/sbi] uno tras otro con la misma combinación de bloques dentro. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes hacer que sea más fácil de leer usando un bloque [sbi]<< > o < >>[/sbi] combinando las condiciones en un solo bloque [sbi]si < > entonces[/sbi].
unnecessary_if_after_until=[b]Problema:[/b] [newLine] Estás utilizando un bloque [sbi]si < >, entonces[/sbi] después de un bloque [sbi]repetir hasta que < >[/sbi] con la misma condición. Los bloques dentro del [sbi]si < >, entonces[/sbi] se ejecutarán siempre. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes, por tanto, borrar el bloque [sbi]si < >, entonces[/sbi].
unnecessary_if_after_until_else=[b]Problema:[/b] [newLine] Estás utilizando un bloque [sbi]si < >, entonces si no[/sbi] después de un bloque [sbi]repetir hasta que < >[/sbi] con la misma condición. Los bloques dentro del [sbi]si < >, entonces si no[/sbi] se ejecutarán siempre. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes, por tanto, borrar el bloque [sbi]si < >, entonces si no[/sbi].
unnecessary_message=[b]Problema:[/b] [newLine] Estás utilizando un bloque [sbi]enviar (%MESSAGE v)[/sbi] inmediatamente después del bloque controlador de eventos. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Podrías usar simplemente el mismo controlador de eventos en los scripts que comienzan con [sbi]al recibir [%MESSAGE v][/sbi].
unnecessary_move=[b]Problema:[/b] [newLine] Estás utilizando un bloque de movimiento que no cambia la posición del sprite. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes eliminar el bloque.
unnecessary_rotation=[b]Problema:[/b] [newLine] Estás utilizando un giro que no cambia la orientación del sprite. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes eliminar el bloque de giro.
unnecessary_say=[b]Problema:[/b] [newLine] Estás usando un bloque [sbi]decir ( ) durante ( ) segundos[/sbi]. Dado que el valor del tiempo es 0, este bloque no tiene efecto. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes borrarlo.
unnecessary_size_change=[b]Problema:[/b] [newLine] Estás utilizando un bloque que no cambia el tamaño del sprite. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes eliminar el bloque.
unnecessary_stop_script=[b]Problema:[/b] [newLine] Hay un bloque [sbi]detener [este programa v][/sbi] al final de un script. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes borrarlo.
unnecessary_think=[b]Problema:[/b] [newLine] Estás usando un bloque [sbi]pensar ( ) durante ( ) segundos[/sbi]. Dado que el valor del tiempo es 0, este bloque no tiene efecto. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes borrarlo.
unnecessary_wait=[b]Problema:[/b] [newLine] Estás usando un bloque [sbi]esperar ( ) segundos[/sbi]. Dado que el valor es 0, este bloque no tiene efecto. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Puedes borrarlo.
unused_answer=[b]Problema:[/b] [newLine] Se utiliza el bloque [sbi]preguntar ( ) y esperar[/sbi], pero nunca se usa la respuesta. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Utiliza el bloque [sbi](respuesta)[/sbi] en tu proyecto.
unused_custom_block=[b]Problema:[/b] [newLine] Has creado un bloque personalizado pero nunca lo usas en tu proyecto. Esto hace que el proyecto esté desordenado. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Elimina el bloque personalizado.
unused_parameter=[b]Problema:[/b] [newLine] Has creado un parámetro pero nunca lo usas en tu procedimiento. Esto hace que el bloque personalizado sea más difícil de entender. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Elimina el parámetro.
unused_variables=[b]Problema:[/b] [newLine] Has creado una variable [var]%VARIABLE[/var] pero nunca la usas en tu proyecto. Esto hace que el proyecto sea más difícil de entender. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Borra la variable [var]%VARIABLE[/var] o usa los bloques [sbi]dar a [%VARIABLE v] el valor ( )[/sbi], [sbi]sumar a [%VARIABLE v] ( )[/sbi] en tu proyecto.
unused_variables_list=[b]Problema:[/b] [newLine] Has creado una variable de tipo lista [var]%VARIABLE[/var], pero nunca la utilizas en tu proyecto. Esto hace que tu código sea más difícil de entender. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Borra la variable de tipo lista [var]%VARIABLE[/var] o usa los bloques [sbi]sumar a [%VARIABLE v] ( )[/sbi], [sbi]dar a [%VARIABLE v] el valor ( )[/sbi] en tu proyecto.
used_variables=¡Muy bien! Sabes que una variable debe inicializarse antes de usarse.
used_variables_list=¡Muy bien! Sabes que una lista debe inicializarse antes de usarse.
useful_position_check=¡Bien hecho! En Scratch, los valores de las coordenadas x e y son valores de punto flotante muy exactos. Una comprobación [EQ] con estos números puede causar problemas. Para evitarlo, has utilizado los operadores [LEQ] o [GEQ].
useless_wait=[b]Problema:[/b] [newLine] Has utilizado un [sbi]esperar () segundos[/sbi] sin ningún bloque siguiente en el mismo script. Por lo tanto, la espera no tiene ningún efecto. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Necesitas que la espera vaya seguida de otros bloques o puedes eliminarla.
valid_termination=¡Bien! Has implementado una condición de terminación válida en tu bucle, lo que evita que el bucle se ejecute para siempre.
variable_as_literal=[b]Problema:[/b] [newLine] Estás usando el nombre de una variable como texto. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] ¿No será que lo que quieres hacer es utilizar el bloque  %VARIABLE en su lugar?
variable_initialization_race=[b]Problema:[/b] [newLine] Una variable se inicializa en diferentes scripts activados por el mismo evento. El resultado puede cambiar según el orden en que se ejecuten los scripts. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Intenta asignar los valores en solo uno de los scripts.
waiting_check_stop=¡Bien! Estás esperando que una condición detenga tu programa.
# mBlock
ambient_light_in_bounds=¡Muy bien! Estás midiendo la luz ambiental en el rango del sensor.
ambient_light_out_of_bounds=Estás intentando medir la luz ambiental en un rango que no es posible. Usa un valor entre 0 y 100.
battery_level_in_bounds=¡Muy bien! Estás midiendo el nivel de batería en el rango posible.
battery_level_out_of_bounds=Estás intentando medir el nivel de batería del robot en un rango que no es posible. Usa un valor entre 0 y 100.
codey_upload_stop_timed=Si se ejecuta el script "parar todo" mientras se está ejecutando un bloque temporizado, éste ya no se apagará.
codey_upload_stop_timed_possible=Este código puede ser ejecutado como una carga. Si se ejecuta la secuencia de comandos "detener todo" mientras se está ejecutando un bloque temporizado, éste no se apagará.
color_detection_in_bounds=¡Muy bien! Estás comparando el valor de color en el rango del sensor.
color_detection_out_of_bounds=Estás intentando medir el valor de color en un rango que no es posible. Usa un número entero entre 0 y 255.
color_setting_in_bounds=¡Muy bien! Estás configurando el color en el rango posible.
color_setting_out_of_bounds=Estás intentando establecer el valor de color en un rango que no es posible. Usa un número entero entre 0 y 255.
detect_repeat_in_loop=Las entradas se consultan en un bucle rápido que no contiene sentencias de espera. Esto hace que las entradas se lean varias veces y el código se ejecute varias veces.
gear_potentiometer_in_bounds=¡Muy bien! Estás midiendo el valor del potenciómetro del engranaje del robot en el rango posible.
gear_potentiometer_out_of_bounds=Estás intentando medir el valor del potenciómetro del engranaje del robot en un rango que no es posible. Usa un número entero entre 0 y 100.
interrupted_loop_sensing_robot=El bloque [bc]%BLOCKNAME[/bc] interrumpe la comprobación de la condición del bloque [bc]%THENELSE[/bc] mientras se ejecuta. Puede suceder que se produzca la condición, pero tu script no reacciona en consecuencia porque estás ocupado haciendo el bloque [bc]%BLOCKNAME[/bc]. Considera realizar la verificación de la condición en un script separado (paralelo).
led_off_script=¡Genial! Tienes un script para apagar todos los LED.
led_off_script_missing=Los LEDs pueden encenderse, pero no hay un script para apagarlos de nuevo.
line_following_in_bounds=¡Muy bien! Estás comparando el valor del sensor de seguimiento de línea en el rango posible.
line_following_out_of_bounds=Estás intentando medir un valor que no se puede detectar con el sensor de seguimiento de línea. Usa un número entero entre 0 y 3.
loop_sensing_robot=¡Muy bien! Para asegurarte de no perderte un evento, compruebas continuamente si ocurre en un bucle por siempre.
looped_statement_not_stopped=Los recursos, como los motores o las lámparas, no se detienen con su respectiva sentencia de parada si la sentencia en ejecución está en un bucle. Aquí se necesita una declaración de fin de obra.
loudness_in_bounds=¡Muy bien! Estás comparando el valor del sensor de sonoridad en el rango posible.
loudness_out_of_bounds=Estás intentando medir la sonoridad en un rango que no es posible. Usa un valor entre 0 y 100.
matrix_off_script=¡Genial! Tienes un script para apagar la matriz de LED.
matrix_off_script_missing=La matriz se puede encender, pero no hay ningún script para volver a apagarla.
missing_loop_robot_sensing=Tu script ha de ejecutar acciones cuando ocurra un evento. Para ello, el script ha de estar continuamente verificando si el evento ha sucedido para no perdérselo.
motor_low_power=Los motores MBot necesitan al menos un 50% de potencia para funcionar de forma fiable.
motor_off_script=¡Genial! Tienes un script para apagar todos los motores.
motor_power_in_bounds=¡Muy bien! Estás usando potencia de motor que se ajusta al robot.
motor_power_out_of_bounds=La potencia del motor se da en porcentaje y, por tanto, sólo puede estar entre 0 y 100.
motor_power_minus=Estás usando una potencia de motor negativa. El robot se mueve en la dirección opuesta. Para hacer el programa más fácil de entender, deberías usar el bloque para esta dirección.
motor_stop_script_missing=El motor se puede encender, pero no hay ningún script para volver a apagarlo.
multiple_attribute_modifications_robot=Hay varios cambios de la misma variable o atributo uno detrás de otro, que podrían ser reemplazados por una única instrucción.
multiple_attribute_modifications_custom_robot=Hay varios cambios de %VARIABLE uno detrás de otro, que podrían ser reemplazados por una única instrucción.
parallel_board_launch_script=Los MBots no pueden ejecutar scripts paralelos en modo de carga.
parallel_resource_use=Los recursos de salida, como los motores o las lámparas, pueden causar problemas si son controlados por dos scripts en paralelo.
parallelisation_robot=¡Bien hecho! Inicias al menos dos scripts con el mismo evento. Enhorabuena, has implementado el concepto de paralelización.
pitch_angle_in_bounds=¡Muy bien! Estás comparando el valor del sensor de ángulo de inclinación en el rango posible.
pitch_angle_out_of_bounds=Estás intentando medir el ángulo de inclinación del robot en un rango que no es posible. Usa un número entero entre -180 y 180.
responsive_loop_sensing=Este bucle comprueba si hay entrada y responde inmediatamente sin demora.
rocky_light_off_script=¡Genial! Tienes un script para apagar la luz de Rocky.
rocky_light_off_script_missing=La luz de Codey se puede encender, pero carece de un script que la apague de nuevo.
roll_angle_in_bounds=¡Bien hecho! Estás comparando el valor del sensor de ángulo de balanceo en el rango posible.
roll_angle_out_of_bounds=Estás intentando medir el ángulo de balanceo del robot en un rango que no es posible. Usa un número entero entre -90 y 90.
sensor_value_equals=Los sensores rara vez pueden medir valores exactos y fiables. Para ello deben utilizarse rangos de valores.
shaking_strength_in_bounds=¡Bien hecho! Estás comparando el valor del sensor de fuerza de agitación en el rango posible.
shaking_strength_out_of_bounds=Estás intentando medir la fuerza de agitación en un rango que no es posible. Usa un número entero entre 0 y 100.
timed_statement_in_live_loop=Cuando una acción cronometrada se realiza sola en un bucle de repetición, tartamudea en el modo directo.
timed_statement_in_possible_live_loop=Este código puede ser ejecutado en el modo de vida. Si una acción cronometrada se realiza sola en un bucle de repetición, tartamudeará en el modo directo.
ultra_sonic_in_bounds=¡Bien hecho! Estás comparando el valor del sensor ultrasónico en el rango posible.
ultra_sonic_out_of_bounds=Estás intentando medir una distancia que no se puede detectar con el sensor ultrasónico. Usa un valor entre 3cm y 400cm.
unnecessary_time_robot=Estás usando un bloque que toma cierto tiempo. Dado que el valor del tiempo es 0, este bloque no tiene efecto. Puedes eliminarlo.
overwritten_visual_effect=[b]Problema:[/b] [newLine] Tienes dos bloques de efectos visuales seguidos sin tiempo de espera entre ellos. El primer efecto se sobrescribirá inmediatamente y no será visible. [newLine] [newLine] [b]Sugerencia para mejorar el código:[/b] [newLine] Elimina el primer bloque o añade un bloque [sbi]esperar ( ) segundos[/sbi] entre ellos.
empty_parameter=[b]Problema:[/b] Falta un parámetro.\n\n[b]Sugerencia para mejorar el código:[/b] Rellena el hueco vacío.
empty_parameter_direction=[b]Problema:[/b] Falta una dirección.\n\n[b]Sugerencia para mejorar el código:[/b] Introduce un número para la dirección (0-360).
empty_parameter_color=[b]Problema:[/b] Falta un color.\n\n[b]Sugerencia para mejorar el código:[/b] Selecciona un color.
empty_parameter_position=[b]Problema:[/b] Falta una posición.\n\n[b]Sugerencia para mejorar el código:[/b] Selecciona una posición del menú.
