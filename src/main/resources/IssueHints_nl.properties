ambiguous_custom_block_signature=[b]Probleem:[/b] [newLine] De namen voor je eigen blokken zijn niet uniek. Je programma kan geen onderscheid maken tussen de blokken met dezelfde naam. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik altijd unieke namen voor je eigen blokken.
ambiguous_parameter_name_unused=[b]Probleem:[/b] [newLine] De parameter-namen van je eigen blokken zijn niet uniek. Je programma kan geen onderscheid maken tussen de parameters met dezelfde naam. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik altijd unieke namen voor parameters.
ambiguous_parameter_name_used=[b]Probleem:[/b] [newLine] De parameter-namen van je eigen blokken zijn niet uniek. Je programma kan geen onderscheid maken tussen de parameters met dezelfde naam. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik altijd unieke namen voor parameters.
ask_and_answer_perfume=Goed gedaan! Je gebruikt de vraag- en antwoordblokken voor interactie met de gebruiker.
backdrop_switch=Goed gedaan! Je gebruikt de achtergrondwissel-gebeurtenis om verschillende scripts te starten. Hiermee kun je verschillende acties uitvoeren afhankelijk van de achtergrond van het spel.
blocking_if_else=[b]Probleem:[/b] [newLine] Je gebruikt [sbi]stop [alle v][/sbi] of [sbi]stop [dit script v][/sbi] blokken in zowel de [IF] als de [ELSE] tak van dit blok. Het script stopt dus hoe dan ook. De blokken na het [sbi]als < > dan[/sbi] blok worden nooit uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik het stopcommando in slechts één tak of verwijder de blokken na het [sbi]als < > dan[/sbi] blok.
blocking_if_else_inside_loop=[b]Probleem:[/b] [newLine] Je gebruikt [sbi]stop [alle v][/sbi] of [sbi]stop [dit script v][/sbi] blokken in zowel de [IF] als de [ELSE] tak van dit blok. Het script stopt dus hoe dan ook. De lus buiten het [sbi]als < > dan[/sbi] blok wordt onjuist uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik het stopcommando in slechts één tak of verwijder de lus.
boolean_expression=Netjes! Je gebruikt Booleaanse expressies in je programma.
busy_waiting_all=[b]Probleem:[/b] [newLine] In je script controleer je voortdurend een voorwaarde, alleen maar om alles te stoppen zodra aan de voorwaarde is voldaan. Er is een betere oplossing in Scratch. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik het [sbi]wacht tot < >[/sbi] blok in plaats van de lus en het voorwaardelijke statement om te wachten tot aan de voorwaarde is voldaan.
busy_waiting_clone=[b]Probleem:[/b] [newLine] In je script controleer je voortdurend een voorwaarde, alleen maar om de kloon te verwijderen zodra aan de voorwaarde is voldaan. Er is een betere oplossing in Scratch. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik het [sbi]wacht tot < >[/sbi] blok in plaats van de lus en het voorwaardelijke statement om te wachten tot aan de voorwaarde is voldaan.
busy_waiting_script=[b]Probleem:[/b] [newLine] In je script controleer je voortdurend een voorwaarde, alleen maar om het script te stoppen zodra aan de voorwaarde is voldaan. Er is een betere oplossing in Scratch. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik het [sbi]wacht tot < >[/sbi] blok in plaats van de lus en het voorwaardelijke statement om te wachten tot aan de voorwaarde is voldaan.
call_without_definition=[b]Probleem:[/b] [newLine] Je gebruikt een eigen blok [sbi]%BLOCKNAME[/sbi] dat niet meer bestaat. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder alle instanties waar het verwijderde eigen blok wordt gebruikt. Als je een eigen blok nodig hebt, maak dan een nieuwe aan en voeg deze toe aan je code.
clone_type_1=[b]Probleem:[/b] [newLine] Er zijn identieke statements in meerdere scripts. Dubbele code maakt je programma foutgevoelig en verwarrend. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Maak en gebruik een eigen blok om de code te vereenvoudigen.
clone_type_2=[b]Probleem:[/b] [newLine] Er zijn vergelijkbare statements in meerdere scripts, die alleen verschillen in parameters. Dubbele code maakt je programma foutgevoelig en verwarrend. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Maak en gebruik een eigen blok om de code te vereenvoudigen.
clone_type_3=[b]Probleem:[/b] [newLine] Er is vergelijkbare code in meerdere scripts. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Maak en gebruik een eigen blok om de code te vereenvoudigen.
collision=Goed gedaan! Je sprite reageert op botsingen.
comparing_literals_default_false=[b]Probleem:[/b] [newLine] Je vergelijkt twee teksten waarbij het resultaat altijd [FALSE] is. Daardoor wordt de code binnen het [sbi]%THENELSE[/sbi] blok %ALWAYSNEVER uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verander de vergelijking in iets zinvols of verwijder het controle blok.
comparing_literals_default_true=[b]Probleem:[/b] [newLine] Je vergelijkt twee teksten waarbij het resultaat altijd [TRUE] is. Daardoor wordt je code binnen het [sbi]%THENELSE[/sbi] blok %ALWAYSNEVER uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok.
comparing_literals_default_variable=[b]Probleem:[/b] [newLine] De vergelijking zal altijd %TRUEFALSE%ADDINFODICT opleveren. Daardoor wordt de code binnen het [sbi]%THENELSE[/sbi] blok %ALWAYSNEVER uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Was het de bedoeling om een variabele [var]%VARIABLE[/var] te gebruiken voor de vergelijking? Ga dan naar de variabelen tab om een variabele [var]%VARIABLE[/var] te maken. Sleep vervolgens het [var]%VARIABLE[/var] blok in het vergelijkings-vak.
comparing_literals_default_variable_exists=[b]Probleem:[/b] [newLine] De vergelijking zal altijd %TRUEFALSE%ADDINFODICT opleveren. Daardoor wordt de code binnen het [sbi]%THENELSE[/sbi] blok %ALWAYSNEVER uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Was het de bedoeling om de variabele [var]%VARIABLE[/var] te gebruiken voor de vergelijking? Sleep dan het blok voor deze variabele in het vergelijkingsvak.
comparing_literals_default_variable_exists_two=[b]Probleem:[/b] [newLine] De vergelijking zal altijd %TRUEFALSE%ADDINFODICT opleveren. Daardoor wordt de code binnen het [sbi]%THENELSE[/sbi] blok %ALWAYSNEVER uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Was het de bedoeling om de variabele [var]%VARIABLE1[/var] of de variabele [var]%VARIABLE2[/var] te gebruiken voor de vergelijking? Sleep dan het blok voor de betreffende variabele in het vergelijkings-vak.
comparing_literals_default_variable_exists_two_without_information=[b]Probleem:[/b] [newLine] De vergelijking zal altijd %TRUEFALSE%ADDINFODICT opleveren. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Was het de bedoeling om de variabele [var]%VARIABLE1[/var] of de variabele [var]%VARIABLE2[/var] te gebruiken voor de vergelijking? Sleep dan het blok voor de betreffende variabele in het vergelijkings-vak.
comparing_literals_default_variable_exists_without_information=[b]Probleem:[/b] [newLine] De vergelijking zal altijd %TRUEFALSE%ADDINFODICT opleveren. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Was het de bedoeling om de variabele [var]%VARIABLE[/var] te gebruiken voor de vergelijking? Sleep dan het blok voor deze variabele in het vergelijkings-vak.
comparing_literals_default_variable_two=[b]Probleem:[/b] [newLine] De vergelijking zal altijd %TRUEFALSE%ADDINFODICT opleveren. Daardoor wordt de code binnen het [sbi]%THENELSE[/sbi] blok %ALWAYSNEVER uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Was het de bedoeling om de variabele [var]%VARIABLE1[/var] of de variabele [var]%VARIABLE2[/var] te gebruiken voor de vergelijking? Ga dan naar de variabelen tab om de variabelen te maken. Sleep vervolgens het blok voor de betreffende variabele in het vergelijkings-vak.
comparing_literals_default_variable_two_without_information=[b]Probleem:[/b] [newLine] De vergelijking zal altijd %TRUEFALSE%ADDINFODICT opleveren. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Was het de bedoeling om de variabele [var]%VARIABLE1[/var] of de variabele [var]%VARIABLE2[/var] te gebruiken voor de vergelijking? Ga dan naar de variabelen tab om de variabelen te maken. Sleep vervolgens het blok voor de betreffende variabele in het vergelijkings-vak.
comparing_literals_default_variable_without_information=[b]Probleem:[/b] [newLine] De vergelijking zal altijd %TRUEFALSE%ADDINFODICT opleveren. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Was het de bedoeling om een variabele [var]%VARIABLE[/var] te gebruiken? Ga dan naar de variabelen tab om een variabele [var]%VARIABLE[/var] te maken. Sleep vervolgens het [var]%VARIABLE[/var] blok in het vergelijkings-vak.
comparing_literals_default_without_information=[b]Probleem:[/b] [newLine] Je vergelijkt twee teksten waarbij het resultaat altijd %TRUEFALSE%ADDINFODICT is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verander de vergelijking in iets zinvols of verwijder het controle blok.
comparing_literals_fix=Super! Je hebt het probleem van Waarden Vergelijken opgelost.
