comparing_literals_wait_variable_two=[b]Probleem:[/b] [newLine] De vergelijking zal altijd %TRUEFALSE%ADDINFODICT opleveren. Daardoor wordt de code na het [sbi]wacht tot < >[/sbi] blok %ALWAYSNEVER uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Was het de bedoeling om een variabele [var]%VARIABLE1[/var] of een variabele [var]%VARIABLE2[/var] te gebruiken voor de vergelijking? Ga dan naar de variabelen tab om de variabelen te maken. Sleep vervolgens het blok voor de betreffende variabele in het vergelijkingsvak.
conditional_inside_loop=Goed! Je controleert op bepaalde voorwaarden binnen een lus, wat betekent dat je belangrijke controleblokken combineert. Dit helpt je complexere problemen op te lossen.
controlled_broadcast_or_stop=Goed gedaan! Om meer controle over je programma te hebben, controleer je continu op bepaalde voorwaarden voordat je een signaal uitzendt of het programma/script stopt.
coordination=Heel goed! Je kunt je scripts binnen het programma goed coördineren! Dat is erg belangrijk voor grotere programma's. De beste manier is het gebruik van signalen en [sbi]wacht tot < >[/sbi] blokken.
correct_broadcast=Goed gedaan! Je hebt een signaal correct geïmplementeerd, nu kun je je scripts eenvoudig coördineren.
custom_block_usage=Heel goed! Je hebt een eigen blok gemaakt en gebruikt in je programma.
custom_block_with_forever=[b]Probleem:[/b] [newLine] Het eigen blok [sbi]%METHOD[/sbi] bevat een [sbi]herhaal[/sbi] lus zonder stopvoorwaarde. Als je het [sbi]%METHOD[/sbi] blok aanroept, blijft de programma-uitvoering binnen dit blok en verlaat het nooit. De statements na het [sbi]%METHOD[/sbi] blok zullen nooit worden uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg een stopvoorwaarde toe aan de lus.
custom_block_with_termination=[b]Probleem:[/b] [newLine] Het eigen blok [sbi]%METHOD[/sbi] bevat een [sbi]stop [alle v][/sbi] blok of een [sbi]verwijder deze kloon[/sbi] blok. Daarom zullen de blokken na het [sbi]%METHOD[/sbi] blok in [bc]een ander script[/bc] nooit worden uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het [sbi]stop [alle v][/sbi] blok of het [sbi]verwijder deze kloon[/sbi] blok of gebruik een [sbi]als < > dan[/sbi] blok om niet bij elke uitvoering te stoppen.
dead_code=[b]Probleem:[/b] [newLine] Je project bevat blokken die niet zijn verbonden met een gebeurtenisblok. Dat betekent dat ze nooit zullen worden uitgevoerd. Dit maakt het project verwarrend. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder de blokken als je ze niet nodig hebt. Als je wilt dat ze worden uitgevoerd, voeg ze dan in op de juiste plaats in de rest van de code of verbind ze met een gebeurtenisblok.
delete_clone_in_loop=[b]Probleem:[/b] [newLine] Je code verwijdert de kloon in de eerste iteratie van de lus. De lus is dus overbodig en je programma is verwarrend. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder de lus.
directed_motion=Goed gedaan! Je sprite kan worden bewogen door op toetsen te drukken. Dit is een belangrijk onderdeel van de meeste computerspellen.
double_if=[b]Probleem:[/b] [newLine] Je project bevat twee opeenvolgende voorwaardelijke statements met dezelfde voorwaarde. Het is onnodig om de voorwaarde twee keer te controleren. Dit maakt het project verwarrend. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg de twee voorwaardelijke statements samen tot een voorwaardelijk statement.
duplicate_sprite=[b]Probleem:[/b] [newLine] Je project bevat exacte kopieën van dezelfde sprite. Dit maakt je project verwarrend. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Maak klonen van de sprite die je meerdere keren wilt hebben.
duplicated_script=[b]Probleem:[/b] [newLine] Je project bevat één identiek script twee keer. Dit maakt je project verwarrend. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder een van de scripts.
duplicated_scripts_covering=[b]Probleem:[/b] [newLine] Je project bevat één identiek script twee keer. Bovendien overlappen de scripts precies, dus je bent je er misschien niet van bewust. Dit kan leiden tot onverwacht gedrag van je programma. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder een van de scripts.
empty_control_body=[b]Probleem:[/b] [newLine] Je hebt een [sbi]%BLOCKNAME[/sbi] blok gebruikt, dat geen blokken bevat. Bijgevolg gebeurt er niets wanneer dit blok wordt aangeroepen. Dit maakt je code verwarrend. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Overweeg het blok te verwijderen als je het niet nodig hebt.
empty_custom_block=[b]Probleem:[/b] [newLine] Je hebt een eigen blok [sbi]%BLOCKNAME[/sbi] gemaakt dat geen statements bevat. Wanneer het eigen blok wordt aangeroepen, gebeurt er niets. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok of voeg geschikte blokken toe aan de definitie.
empty_parameter=[b]Probleem:[/b] [newLine] Er ontbreekt een parameter. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Vul het lege veld in.
empty_parameter_direction=[b]Probleem:[/b] [newLine] Er ontbreekt een richting. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voer een getal in voor de richting (0-360).
empty_parameter_color=[b]Probleem:[/b] [newLine] Er ontbreekt een kleur. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Selecteer een kleur.
empty_parameter_position=[b]Probleem:[/b] [newLine] Er ontbreekt een positie. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Selecteer een positie uit het menu.
empty_project=[b]Probleem:[/b] [newLine] Het project is leeg. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Start je project door een eerste sprite toe te voegen.
empty_script=[b]Probleem:[/b] [newLine] Je sprite bevat een gebeurtenisblok [sbi]%BLOCKNAME[/sbi] zonder dat er andere blokken mee verbonden zijn. Wanneer de gebeurtenis plaatsvindt, gebeurt er niets. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok als er niets hoeft te gebeuren. Als je wilt dat er iets gebeurt, verbind dan andere blokken met het gebeurtenisblok.
empty_sprite=[b]Probleem:[/b] [newLine] De sprite %SPRITE bevat geen blokken. Hij kan niet reageren op gebruikersinvoer of sprite-interactie. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Als dit de bedoeling is, laat het dan zo. Sleep anders geschikte blokken naar de programmeerruimte van deze sprite.
endless_recursion_broadcast=[b]Probleem:[/b] [newLine] Het script dat reageert op het bericht [bc]%MESSAGE[/bc] zendt dit bericht zelf opnieuw uit. Daarom zal het script oneindig vaak achter elkaar worden uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg een stopvoorwaarde toe aan dit script.
endless_recursion_procedure=[b]Probleem:[/b] [newLine] Het eigen blok [sbi]%BLOCKNAME[/sbi] gebruikt dit blok zelf. Daarom zal het blok oneindig vaak achter elkaar worden uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg een stopvoorwaarde toe aan de code van het eigen blok.
expression_as_touching_or_color=[b]Probleem:[/b] [newLine] Dit blok verwacht een kleur of een sprite als parameter en werkt niet met tekst of getallen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het ingevoegde blok en kies in plaats daarvan een kleur of een van de gegeven opties.
forever_inside_if=[b]Probleem:[/b] [newLine] De lus [sbi]herhaal[/sbi] wordt nooit verlaten. De blokken buiten de lus (ook de blokken na het [sbi]als < > dan[/sbi] blok) worden nooit uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Probeer de binnenste lus weg te laten. Misschien helpt het om de twee controle-blokken om te wisselen.
forever_inside_loop=[b]Probleem:[/b] [newLine] De binnenste lus [sbi]herhaal[/sbi] wordt nooit verlaten. Alle blokken buiten de lus worden nooit uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Probeer de binnenste lus weg te laten.
forever_inside_loop_fix=Goed! Je hebt de 'Herhaal Binnen Lus' verwijderd.
gliding_motion=Goed gedaan! Door op een toets te drukken, kun je je sprite in een bepaalde richting laten glijden. Dit is een belangrijk onderdeel van veel computerspellen.
hide_without_show=[b]Probleem:[/b] [newLine] Je programma gebruikt een [sbi]verdwijn[/sbi] blok, maar geen [sbi]verschijn[/sbi] blok. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Als je wilt dat de sprite later weer zichtbaar is, voeg dan een [sbi]verschijn[/sbi] blok in op een geschikte plaats.
illegal_parameter_refactor=[b]Probleem:[/b] [newLine] De parameter heeft het verkeerde type. Door het eigen blok te bewerken, is het type van de parameter gewijzigd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Kies een geschikt type voor de parameter en sleep de parameter vervolgens opnieuw naar zijn plaats.
immediate_delete_clone_after_broadcast=[b]Probleem:[/b] [newLine] Het script verwijdert de kloon onmiddellijk na het [sbi]zend signaal (%MESSAGE v)[/sbi] blok. Het script dat door het bericht wordt aangeroepen en begint met een [sbi]wanneer ik signaal [%MESSAGE v] ontvang[/sbi] blok, zal niet correct worden uitgevoerd voor deze kloon van de sprite %SPRITE. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik in plaats daarvan een [sbi]zend signaal (%MESSAGE v) en wacht[/sbi] blok.
immediate_stop_after_say_think=[b]Probleem:[/b] [newLine] Het script stopt alles onmiddellijk na het [sbi]%SAYTHINK[/sbi] blok. De tekst wordt nooit getoond. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Vervang het [sbi]%SAYTHINK[/sbi] blok door een [sbi]%SAYTHINK ( ) ( ) sec.[/sbi] blok. Om de rest van het programma onmiddellijk te stoppen, voeg je een [sbi]stop [andere scripts in sprite v][/sbi] toe voor het [sbi]%SAYTHINK ( ) ( ) sec.[/sbi] blok.
immediate_stop_after_say_think_multiple=[b]Probleem:[/b] [newLine] Het script stopt alles onmiddellijk na het [sbi]%SAYTHINK[/sbi] blok. De tekst wordt nooit getoond. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Vervang het [sbi]%SAYTHINK[/sbi] blok door een [sbi]%SAYTHINK ( ) ( ) sec.[/sbi] blok. Om de rest van het programma onmiddellijk te stoppen, voeg je een [sbi]stop [andere scripts in sprite v][/sbi] blok toe voor het [sbi]%SAYTHINK ( ) ( ) sec.[/sbi] blok. Als je de scripts van andere sprites wilt stoppen terwijl het [sbi]%SAYTHINK ( ) ( ) sec.[/sbi] blok wordt uitgevoerd, moet je deze sprites informeren door een [sbi]zend signaal (bericht v)[/sbi] blok te gebruiken dat ze hun scripts moeten stoppen.
inappropriate_handler_delete_clone=[b]Probleem:[/b] [newLine] Het script bevat een [sbi]verwijder deze kloon[/sbi] blok, maar het kan niet worden uitgevoerd omdat het niet duidelijk is welke kloon door het gebeurtenisblok [sbi]%EVENTHANDLER[/sbi] beïnvloed zou moeten worden. [newLine] [newLine] [b]Suggestie voor verbetering:[/b] [newLine] Start het script met een [sbi]wanneer ik als kloon start[/sbi] of [sbi]wanneer op deze sprite wordt geklikt[/sbi] blok. Een andere mogelijkheid is om het [sbi]verwijder deze kloon[/sbi] blok te verplaatsen naar [bc]een ander script[/bc] dat begint met een van deze blokken.
inappropriate_intimacy=[b]Probleem:[/b] [newLine] Dit script gebruikt attributen van de sprite %SPRITE vaker dan zijn eigen attributen. Dit suggereert dat het script mogelijk bij de andere sprite hoort. [newLine] [newLine] [b]Suggestie voor verbetering:[/b] [newLine] Verplaats het script naar de sprite %SPRITE of verminder de afhankelijkheid.
initialisation_of_looks_sprite=Goed gedaan! Je initialiseert het uiterlijk van je sprite bij elke nieuwe programma-start.
initialisation_of_looks_stage=Goed gedaan! Je initialiseert het uiterlijk van je speelveld bij elke nieuwe programma-start.
initialisation_of_position=Goed gedaan! Je initialiseert de locatie van je sprite bij elke nieuwe programma-start.
interrupted_loop_sensing=[b]Probleem:[/b] [newLine] Het [sbi]%BLOCKNAME[/sbi] blok onderbreekt de controle van de voorwaarde in het [sbi]%THENELSE[/sbi] blok. Het kan gebeuren dat aan de voorwaarde is voldaan maar je script niet dienovereenkomstig reageert omdat het bezig is met het uitvoeren van het [sbi]%BLOCKNAME[/sbi] blok. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Probeer de voorwaarde te controleren in een parallel script (dit betekent in [bc]een ander script[/bc]).
invalid_actor_blocks_sprite=[b]Probleem:[/b] [newLine] Dit blok is alleen ontworpen voor sprites en werkt niet op het speelveld. Bewegingsblokken, zeg/denk-blokken, uiterlijkblokken, kloonblokken en verschijn/verdwijn-blokken werken alleen voor sprites. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder dit blok van het speelveld of verplaats het script naar een sprite waar het zal werken.
invalid_actor_blocks_stage=[b]Probleem:[/b] [newLine] Dit blok is alleen ontworpen voor het speelveld en werkt niet op een sprite. Achtergrond-gerelateerde blokken werken alleen op het speelveld. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder dit blok van de sprite of verplaats het script naar het speelveld waar het zal werken.
invalid_number_string=[b]Probleem:[/b] [newLine] Je gebruikt een tekst die eruitziet als een getal maar geen geldig getal is (bijv. meerdere decimalen of wetenschappelijke notatie) in een blok dat een getal verwacht. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een geldig getalformaat of controleer je invoer.
key_set_position=[b]Probleem:[/b] [newLine] Je programma zet de positie van de sprite op een bepaalde waarde telkens wanneer je de toets %KEY indrukt. Waarschijnlijk probeerde je de sprite met een bepaalde waarde te verplaatsen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik het blok [sbi]verander %XY met ( )[/sbi] om de sprite te verplaatsen.
list_usage=Goed gedaan! Je gebruikt een lijst en kunt daarom verzamelingen beheren.
long_script=[b]Probleem:[/b] [newLine] Het script is erg lang. Dit maakt de code verwarrend. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Probeer het script op te splitsen in twee of meer kortere scripts: Elk script zou verantwoordelijk moeten zijn voor een subtaak van je programma. Dat maakt het gemakkelijk om het overzicht te bewaren.
loop_one=[b]Probleem:[/b] [newLine] De lus wordt slechts één keer uitgevoerd. De lus is dus overbodig en maakt je code ingewikkeld. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het lusblok.
loop_sensing=Goed gedaan! Je gebruikt een herhaal-lus om continu te controleren op het optreden van een bepaalde gebeurtenis.
loop_zero=[b]Probleem:[/b] [newLine] De lus wordt nooit uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Als dit de bedoeling is, is je code onnodig ingewikkeld. Verwijder het lusblok en de blokken erin. Als je wilt dat de lus wordt uitgevoerd, moet je misschien een voorwaarde wijzigen of de code voor de lus aanpassen.
matching_parameter=Goed! Je initialiseert een parameter en gebruikt deze daarna.
message_as_literal=[b]Probleem:[/b] [newLine] Je gebruikt de naam van een bericht als tekst. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Waarschijnlijk bedoelde je een [sbi]zend signaal (%MESSAGE v)[/sbi] of [sbi]zend signaal (%MESSAGE v) en wacht[/sbi] blok te gebruiken.
message_naming=[b]Probleem:[/b] [newLine] Het bericht [bc]%MESSAGE[/bc] heeft geen zinvolle naam. Je gebruikt de standaardnaam of een die al is gebruikt, gevolgd door een nummer. Dit maakt je programma moeilijk te begrijpen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik zinvolle en unieke namen voor berichten.
message_never_received=[b]Probleem:[/b] [newLine] Het bericht [bc]%MESSAGE[/bc] wordt verzonden, maar nooit ontvangen door een [sbi]wanneer ik signaal [bericht v] ontvang[/sbi] blok. Er is dus geen reactie op dit bericht. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg een script toe aan de sprite die op het bericht moet reageren. Het script moet beginnen met het [sbi]wanneer ik signaal [bericht v] ontvang[/sbi] blok. Als er geen reactie is bedoeld, is het bericht zinloos. Verwijder het bericht.
message_never_received_fix=Super! Je hebt het probleem van Bericht Nooit Ontvangen opgelost.
message_never_sent=[b]Probleem:[/b] [newLine] Het bericht [bc]%MESSAGE[/bc] dat ontvangen zou moeten worden, wordt nooit verzonden. Daarom zal dit script nooit worden getriggerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Zorg ervoor dat het bericht vooraf vanuit [bc]een ander script[/bc] wordt verzonden. Je hebt hiervoor een [sbi]zend signaal (%MESSAGE v)[/sbi] blok nodig.
message_never_sent_fix=Super! Je hebt het probleem van Bericht Nooit Verzonden opgelost.
message_never_sent_say_think=[b]Probleem:[/b] [newLine] Het bericht %MESSAGE dat ontvangen zou moeten worden, wordt nooit verzonden. Daarom zal dit script nooit worden getriggerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Je gebruikt het bericht als tekst in een [sbi]%SAYTHINK ( )[/sbi] of [sbi]%SAYTHINK ( ) ( ) sec.[/sbi] blok in de volgende sprites: %SPRITES. Gebruik ook een [sbi]zend signaal (%MESSAGE v)[/sbi] blok in deze sprites om iedereen te informeren.
message_never_sent_touching=[b]Probleem:[/b] [newLine] Het bericht %MESSAGE dat ontvangen zou moeten worden, wordt nooit verzonden. Daarom zal dit script nooit worden getriggerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Je gebruikt een [sbi]raak ik (%SPRITE v)?[/sbi] blok in de volgende sprites: %SPRITES. Gebruik ook een [sbi]zend signaal (%MESSAGE v)[/sbi] blok in deze sprites om iedereen te informeren over de botsing.
middle_man_broadcast=[b]Probleem:[/b] [newLine] Dit script wacht op een bericht, alleen maar om onmiddellijk een ander bericht te verzenden. Daarom is dit script slechts een tussenpersoon tussen de oorspronkelijke afzender en de uiteindelijke ontvanger. Dit maakt je programma moeilijk te begrijpen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Het script dat wacht op het bericht van de tussenpersoon kan wachten op het oorspronkelijke bericht. Dan kun je dit script verwijderen om redundante code te voorkomen.
middle_man_procedure=[b]Probleem:[/b] [newLine] Wanneer dit eigen blok wordt uitgevoerd, wordt alleen een ander blok aangeroepen. Daarom is dit eigen blok slechts een tussenpersoon tussen de oorspronkelijke aanroeper en het uiteindelijke blok. Dit maakt je programma moeilijk te begrijpen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] De aanroep van het eigen blok kan worden gewijzigd in een aanroep van het uiteindelijke blok. Dan kun je dit eigen blok verwijderen om redundante code te voorkomen.
missing_ask=[b]Probleem:[/b] [newLine] Je project bevat het [sbi](antwoord)[/sbi] blok, maar er wordt vooraf geen vraag gesteld. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het [sbi](antwoord)[/sbi] blok of gebruik eerst het [sbi]vraag ( ) en wacht[/sbi] blok uit de sectie waarnemen.
missing_backdrop_switch=[b]Probleem:[/b] [newLine] Je project bevat een blok om te reageren op een achtergrondwissel. Maar de geselecteerde achtergrond verschijnt nooit tijdens het programma. Daarom wordt het script nooit uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Zorg ervoor dat je de achtergrond op een geschikt moment tijdens je programma wijzigt.
missing_clone_call=[b]Probleem:[/b] [newLine] Je project bevat een [sbi]Wanneer ik als kloon start[/sbi] blok, maar de sprite wordt nooit gekloond. Daarom wordt het script nooit uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Kloon de sprite vooraf of gebruik een ander gebeurtenisblok.
missing_clone_initialization=[b]Probleem:[/b] [newLine] Een sprite wordt gekloond maar er zijn geen scripts die beginnen met een passend gebeurtenisblok voor de gemaakte kloon. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Als je wilt dat de kloon acties uitvoert, maak dan een script dat begint met een [sbi]Wanneer ik als kloon start[/sbi] blok of een [sbi]Wanneer op deze sprite wordt geklikt[/sbi] blok. Als de kloon zelf niet actief hoeft te zijn, gebruik dan het [sbi]stempel[/sbi] blok van de penuitbreiding in plaats van een kloon te maken.
missing_clone_initialization_delete_clone=[b]Probleem:[/b] [newLine] Een sprite wordt gekloond maar er zijn geen scripts die beginnen met een passend gebeurtenisblok voor de gemaakte kloon. Ook gebruik je een [sbi]verwijder deze kloon[/sbi] blok in een script van de sprite %SPRITE. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Overweeg dit script te starten met een [sbi]Wanneer ik als kloon start[/sbi] blok of een [sbi]Wanneer op deze sprite wordt geklikt[/sbi] blok.
missing_clone_initialization_delete_clone_message=[b]Probleem:[/b] [newLine] Een sprite wordt gekloond maar er zijn geen scripts die beginnen met een passend gebeurtenisblok voor de gemaakte kloon. Ook gebruik je een [sbi]verwijder deze kloon[/sbi] blok in een script van de sprite %SPRITE dat begint met het ontvangen van het bericht [bc]%MESSAGE[/bc]. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Kijk naar de code van de sprite %SPRITE en probeer het script te vinden dat het bericht [bc]%MESSAGE[/bc] verstuurt. Gebruik in plaats van het [sbi]%EVENTHANDLER[/sbi] blok een [sbi]Wanneer ik als kloon start[/sbi] blok of een [sbi]Wanneer op deze sprite wordt geklikt[/sbi] blok in dit script.
missing_clone_initialization_delete_clone_message_multiple=[b]Probleem:[/b] [newLine] Een sprite wordt gekloond maar er zijn geen scripts die beginnen met een passend gebeurtenisblok voor de gemaakte kloon. Ook gebruik je een [sbi]verwijder deze kloon[/sbi] blok in een script van de sprite %SPRITE dat begint met het ontvangen van het bericht [bc]%MESSAGE[/bc]. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Kijk naar de code van de sprite %SPRITE en probeer de scripts te vinden die het bericht [bc]%MESSAGE[/bc] versturen. Gebruik in plaats van het [sbi]%EVENTHANDLER[/sbi] blok een [sbi]Wanneer ik als kloon start[/sbi] blok of een [sbi]Wanneer op deze sprite wordt geklikt[/sbi] blok in deze scripts.
missing_clone_initialization_fix=Super! Je hebt het probleem van Ontbrekende Kloon Initialisatie opgelost.
missing_erase_all=[b]Probleem:[/b] [newLine] Wanneer je iets tekent in Scratch maar je tekening nooit verwijdert, blijven alle tekeningen van een vorige uitvoering ook bij de volgende staan. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Wis de oude tekeningen aan het begin van je programma door een [sbi]wis alles[/sbi] blok te gebruiken.
missing_initialization=[b]Probleem:[/b] [newLine] In deze sprite wordt de variabele %VARIABLE niet geïnitialiseerd voordat deze voor de eerste keer wordt gebruikt. De waarde zal hetzelfde zijn als aan het einde van de laatste uitvoering. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Initialiseer de variabele %VARIABLE door de gewenste waarde toe te kennen aan het begin van een [bc]geschikt script[/bc].
missing_initialization_clone=[b]Probleem:[/b] [newLine] In deze sprite wordt de variabele %VARIABLE niet geïnitialiseerd voordat deze voor de eerste keer wordt gebruikt. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Initialiseer de variabele %VARIABLE door de gewenste waarde toe te kennen aan het begin van een [bc]geschikt script[/bc].
missing_loop_mouse_position_direction=[b]Probleem:[/b] [newLine] Je code draait de sprite maar één keer naar de muisaanwijzer, maar niet tijdens de hele uitvoering van het programma. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Als je wilt dat dit continu gebeurt, zet het blok dan in een [sbi]herhaal[/sbi] blok.
missing_loop_mouse_position_motion=[b]Probleem:[/b] [newLine] Je code beweegt de sprite maar één keer naar de muisaanwijzer, maar niet tijdens de hele uitvoering van het programma. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Als je wilt dat dit continu gebeurt, zet het blok dan in een [sbi]herhaal[/sbi] blok.
missing_loop_sensing=[b]Probleem:[/b] [newLine] De voorwaarde wordt maar één keer gecontroleerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Zet het voorwaardelijke statement in een [sbi]herhaal[/sbi] blok om de voorwaarde continu te controleren.
missing_loop_sensing_fix=Goed! Je hebt het probleem van Ontbrekende Lus Waarneming opgelost.
missing_loop_sensing_fix_wait=Goed! Je hebt het probleem van Ontbrekende Lus Waarneming opgelost.
missing_loop_sensing_variable=[b]Probleem:[/b] [newLine] De voorwaarde wordt maar één keer gecontroleerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Zet het voorwaardelijke statement in een [sbi]herhaal[/sbi] blok om de voorwaarde continu te controleren.
multiple_attribute_modifications=[b]Probleem:[/b] [newLine] Er zijn meerdere wijzigingen aan dezelfde variabele of attribuut achter elkaar. Bij het uitvoeren van het programma heeft alleen de laatste wijziging zichtbare effecten. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Combineer de wijzigingen tot slechts één wijziging.
multiple_attribute_modifications_custom=[b]Probleem:[/b] [newLine] Er zijn meerdere wijzigingen aan %VARIABLE achter elkaar. Bij het uitvoeren van het programma heeft alleen de laatste wijziging zichtbare effecten. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Combineer de wijzigingen tot slechts één wijziging.
multiple_attribute_modifications_saythink=[b]Probleem:[/b] [newLine] Er zijn meerdere [sbi]zeg ( )[/sbi] of [sbi]denk ( )[/sbi] blokken achter elkaar, zonder vertraging. Bij het uitvoeren van het programma heeft alleen de laatste zichtbare effecten. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik in plaats daarvan [sbi]zeg ( ) ( ) sec.[/sbi] of [sbi]denk ( ) ( ) sec.[/sbi] blokken.
missing_pen_down=[b]Probleem:[/b] [newLine] Je programma gebruikt een [sbi]pen neer[/sbi] blok, maar geen [sbi]pen op[/sbi] blok. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Als je wilt stoppen met tekenen, voeg dan op een geschikte plaats een [sbi]pen op[/sbi] blok toe.
missing_pen_up=[b]Probleem:[/b] [newLine] Je programma gebruikt een [sbi]pen op[/sbi] blok, maar geen [sbi]pen neer[/sbi] blok. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Als je iets wilt tekenen, voeg dan op een geschikte plaats een [sbi]pen neer[/sbi] blok toe.
missing_resource=[b]Probleem:[/b] [newLine] De resource die je gebruikt is verwijderd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Maak een nieuwe resource aan of verwijder het blok dat de resource gebruikt.
missing_termination=[b]Probleem:[/b] [newLine] Deze lus heeft geen stopvoorwaarde. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg een stopvoorwaarde toe aan de lus.
missing_wait_until_condition=[b]Probleem:[/b] [newLine] Deze lus herhaalt erg snel. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg een [sbi]wacht ( ) sec.[/sbi] blok toe aan de lus.
mouse_follower=Super! Je sprite volgt de muis. Dit is een goed concept voor veel spellen.
movement_in_loop=Goed gedaan! De bewegingen van je sprite zijn erg vloeiend en natuurlijk omdat je de bewegingen in een lus hebt geïmplementeerd.
nested_conditional_checks=Heel goed! Je gebruikt geneste voorwaarden, zoals geneste [sbi]als < > dan[/sbi] blokken. Dit helpt je om geavanceerdere problemen op te lossen.
nested_loops=[b]Probleem:[/b] [newLine] Geneste lussen kunnen leiden tot onvoorspelbare problemen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Probeer onnodige lussen te verwijderen.
nested_loops_perfume=Heel goed! Je gebruikt geneste lussen. Dit helpt je om geavanceerdere problemen op te lossen.
no_working_scripts=[b]Probleem:[/b] [newLine] Je sprite bevat losse blokken. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verbind de blokken met een hoed-blok (hat block) zodat de sprite reageert op de bijbehorende gebeurtenis.
object_follower=Super! Je sprite volgt andere objecten. Dit is een goed concept voor veel spellen.
orphaned_parameter=[b]Probleem:[/b] [newLine] In je eigen blok gebruik je een parameter die niet meer bestaat. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Wanneer je een eenmaal aangemaakte parameter later verwijdert, zorg er dan voor dat je alle gebruiken van deze parameter verwijdert. Als je besluit de parameter opnieuw te gebruiken, moet je de parameter opnieuw toevoegen aan je eigen blok.
overwritten_visual_effect=[b]Probleem:[/b] [newLine] Je hebt twee visuele effectblokken achter elkaar zonder enige wachttijd ertussen. Het eerste effect wordt onmiddellijk overschreven en zal niet zichtbaar zijn. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het eerste blok of voeg een [sbi]wacht ( ) sec.[/sbi] blok toe ertussen.
parallelisation=Goed! Er worden minstens twee scripts getriggerd door dezelfde gebeurtenis. Dit betekent dat je het concept van parallellisatie gebruikt.
parameter_as_literal=[b]Probleem:[/b] [newLine] Je gebruikt de naam van een parameter als tekst. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Waarschijnlijk bedoelde je de parameter [var]%VARIABLE[/var]. Sleep het blok voor deze parameter in de sleuf.
parameter_out_of_scope=[b]Probleem:[/b] [newLine] Een parameter kan alleen binnen het eigen blok worden gebruikt. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Als je de waarde van de parameter buiten het eigen blok wilt gebruiken, moet je de waarde opslaan in een variabele.
pointless_timer_reset=[b]Probleem:[/b] [newLine] Het blok [sbi]zet timer op 0[/sbi] wordt gebruikt, maar de timerwaarde [sbi](timer)[/sbi] wordt nooit gebruikt.
position_equals_check=[b]Probleem:[/b] [newLine] In Scratch is de positie van een sprite gedefinieerd door het midden. Het is onwaarschijnlijk dat de %COORDINATE coördinaat van een object exact de waarde van je vergelijking heeft. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een benadering met [LEQ] of [GEQ] in plaats daarvan.
floating_point_comparison=[b]Probleem:[/b] [newLine] In Scratch zijn waarden zoals positie, richting, volume of timer kommagetallen. Het is onwaarschijnlijk dat de %COORDINATE van een object de exacte waarde van je vergelijking heeft. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een benadering met [LEQ] of [GEQ] in plaats daarvan.
floating_point_mouse=[b]Probleem:[/b] [newLine] In Scratch wordt de positie van de muisaanwijzer gedefinieerd door de linkerbovenhoek. Het is onwaarschijnlijk dat de %COORDINATE-coördinaat van de muisaanwijzer de exacte waarde van je vergelijking heeft. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik in plaats daarvan een benadering met [LEQ] of [GEQ].
position_equals_check_dist=[b]Probleem:[/b] [newLine] In Scratch is de positie van een sprite gedefinieerd door het midden. Het is onwaarschijnlijk dat de afstand van twee objecten exact de waarde van je vergelijking heeft. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een benadering met [LEQ] of [GEQ] in plaats daarvan.
position_equals_check_zero_mouse=[b]Probleem:[/b] [newLine] In Scratch wordt de afstand tussen een sprite en de muisaanwijzer gemeten van midden tot midden. Het is zeer onwaarschijnlijk dat de middens van beide objecten ooit precies op dezelfde plek zijn. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik in plaats van [EQ] een geschikte benadering met [LEQ] of gebruik een van de blokken [sbi]raak ik ( v)?[/sbi], [sbi]raak ik kleur [#11ff33]?[/sbi], [sbi]is kleur [#11ff33] na aanraking met [#11ff33]?[/sbi] uit de waarnemen tab.
position_equals_check_zero_sprites=[b]Probleem:[/b] [newLine] In Scratch wordt de afstand tussen twee sprites gemeten van midden tot midden. Het is zeer onwaarschijnlijk dat de middens van twee sprites ooit precies op dezelfde plek zijn. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik in plaats van [EQ] een geschikte benadering met [LEQ] of gebruik een van de blokken [sbi]raak ik ( v)?[/sbi], [sbi]raak ik kleur [#11ff33]?[/sbi], [sbi]is kleur [#11ff33] na aanraking met [#11ff33]?[/sbi] uit de waarnemen tab.
recursive_cloning=[b]Probleem:[/b] [newLine] Wanneer een kloon nog meer klonen van zichzelf maakt, kan dit resulteren in een oneindig aantal klonen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Maak alleen klonen van de originele sprite.
redundant_assignment_always=[b]Probleem:[/b] [newLine] Deze toewijzing heeft geen effect omdat de variabele of het attribuut altijd wordt overschreven voordat het gebruikt wordt. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder de onnodige toewijzing.
redundant_assignment_possible=[b]Probleem:[/b] [newLine] Dit is mogelijk overbodig omdat er al een toewijzing is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Controleer of de vorige toewijzing bedoeld was om gebruikt te worden.
same_variable_different_sprite=[b]Probleem:[/b] [newLine] Dezelfde variabelenaam wordt in meerdere sprites gebruikt. Dit kan verwarrend zijn. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik unieke namen voor variabelen.
say_sound_synchronisation=Super! Om je sprite te laten praten, speel je een geluid tegelijkertijd af met een spraakballon. Dat is een geweldige functie!
sequential_actions=[b]Probleem:[/b] [newLine] Je script bevat dezelfde statements meerdere keren achter elkaar. Er is een betere oplossing hiervoor.[newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verkort je code door een lusblok te gebruiken.
sprite_naming=[b]Probleem:[/b] [newLine] De sprite %SPRITE heeft dezelfde naam als een andere sprite, alleen gevolgd door een ander nummer. Dit maakt je programma moeilijk te begrijpen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Geef je sprites zinvolle en unieke namen.
sprite_naming_default=[b]Probleem:[/b] [newLine] De sprite %SPRITE heeft geen zinvolle naam, maar gebruikt de standaardnaam. Dit maakt je programma moeilijk te begrijpen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Geef je sprites zinvolle en unieke namen.
stuttering_movement=[b]Probleem:[/b] [newLine] Wanneer je een toets langer indrukt, verwacht je een constante gebeurtenisverwerking. Helaas is er een vertraging tussen de eerste en tweede ronde van verwerking, waardoor de beweging hapert. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Je kunt deze vertraging voorkomen door het blok [sbi]<toets (%KEY v) ingedrukt?>[/sbi] uit de categorie waarnemen te gebruiken. Je moet het [sbi]als <toets (%KEY v) ingedrukt?> dan[/sbi] blok in een [sbi]herhaal[/sbi] blok plaatsen en ook het gebeurtenisblok [sbi]Wanneer op de groene vlag wordt geklikt[/sbi] gebruiken in plaats van het gebeurtenisblok [sbi]wanneer [%KEY v] is ingedrukt[/sbi].
stuttering_movement_fix=Goed! Je hebt de Haperende Beweging gerepareerd.
terminated_loop=[b]Probleem:[/b] [newLine] De lus wordt beëindigd (bijv. door een stopblok) en wordt nooit herhaald. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het lusblok.
timer=Super! Je gebruikt een variabele als teller of timer in je lus. Je lijkt een goed begrip te hebben van lussen en het gebruik ervan.
type_error=[b]Probleem:[/b] [newLine] Je probeert waarden te vergelijken die niet vergelijkbaar zijn. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik alleen waarden van hetzelfde type in vergelijkingen.
type_error_comparison=[b]Probleem:[/b] [newLine] Je vergelijkt %LEFT met %RIGHT. Vergelijking van %TYPE_LEFT en %TYPE_RIGHT wordt niet aanbevolen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Zorg ervoor dat beide kanten van de vergelijking van hetzelfde type zijn.
type_error_mismatch=[b]Probleem:[/b] [newLine] Hier werd een %EXPECTED verwacht, maar je gaf het blok %BLOCK (een %ACTUAL). [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een waarde van het type %EXPECTED.
type_error_weird_distance=[b]Probleem:[/b] [newLine] Je gebruikt een blok binnen het [sbi]afstand tot ( v)[/sbi] blok waarnaar de afstand niet gemeten kan worden. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok en gebruik een van de gesuggereerde opties gegeven door het [sbi]afstand tot ( v)[/sbi] blok.
unnecessary_boolean_true=[b]Probleem:[/b] [newLine] Je vergelijkt een booleaans waarnemen-blok met de waarde %VALUE. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Je zou gewoon het waarnemen-blok kunnen gebruiken zonder enige vergelijking.
unnecessary_boolean_false=[b]Probleem:[/b] [newLine] Je vergelijkt een booleaans waarnemen-blok met de waarde %VALUE. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Je zou gewoon het waarnemen-blok kunnen gebruiken zonder enige vergelijking, maar het in een [sbi]niet < >[/sbi] blok wikkelen.
unnecessary_glide=[b]Probleem:[/b] [newLine] Je gebruikt een [sbi]schuif in ( ) sec. naar ( v))[/sbi] blok. Omdat de tijdwaarde op 0 staat, is het schuiven niet zichtbaar. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een geschikte tijdwaarde of gebruik een [sbi]ga naar ( v))[/sbi] blok in plaats van het [sbi]schuif in ( ) sec. naar ( v))[/sbi] blok.
unnecessary_glide_xy=[b]Probleem:[/b] [newLine] Je gebruikt een [sbi]schuif in ( ) sec. naar x: ( ) y: ( ))[/sbi] blok. Omdat de tijdwaarde op 0 staat, is het schuiven niet zichtbaar. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een geschikte tijdwaarde of gebruik een [sbi]ga naar x: ( ) y: ( )[/sbi] blok in plaats van het [sbi]schuif in ( ) sec. naar x: ( ) y: ( ))[/sbi] blok.
unnecessary_if=[b]Probleem:[/b] [newLine] Je gebruikt twee [sbi]als < > dan[/sbi] blokken achter elkaar, en dezelfde combinatie van blokken daarin. Dat is omslachtig. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Maak je code gemakkelijker leesbaar door de voorwaarden te combineren met een [sbi]<< > of < >>[/sbi] blok en slechts één [sbi]als < > dan[/sbi] blok te gebruiken.
unnecessary_if_after_until=[b]Probleem:[/b] [newLine] Je gebruikt een [sbi]als < > dan[/sbi] blok na een [sbi]herhaal tot < >[/sbi] blok met dezelfde voorwaarde. De blokken in het [sbi]als < > dan[/sbi] blok worden altijd uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het [sbi]als < > dan[/sbi] blok.
unnecessary_if_after_until_else=[b]Probleem:[/b] [newLine] Je gebruikt een [sbi]als < > dan anders[/sbi] blok na een [sbi]herhaal tot < >[/sbi] blok met dezelfde voorwaarde. De blokken in het bovenste deel van het [sbi]als < > dan anders[/sbi] blok worden altijd uitgevoerd, en de blokken in het onderste deel worden nooit uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het [sbi]als < > dan anders[/sbi] blok.
unnecessary_message=[b]Probleem:[/b] [newLine] Je gebruikt een [sbi]zend signaal (%MESSAGE v)[/sbi] blok onmiddellijk na een gebeurtenisblok. Hier is een betere oplossing voor. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Laat alle scripts die beginnen met [sbi]wanneer ik signaal [%MESSAGE v] ontvang[/sbi] in plaats daarvan met dit gebeurtenisblok beginnen. Dan hoef je het bericht niet te verzenden.
unnecessary_move=[b]Probleem:[/b] [newLine] Het blok verandert de positie van de sprite niet. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok of pas het aan.
unnecessary_rotation=[b]Probleem:[/b] [newLine] Het blok verandert de oriëntatie van de sprite niet. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok of pas het aan.
unnecessary_say=[b]Probleem:[/b] [newLine] Je gebruikt een [sbi]zeg ( ) ( ) sec.[/sbi] blok. Omdat de tijdwaarde op 0 staat, heeft het blok geen effect. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok of gebruik een geschikte tijdwaarde.
unnecessary_size_change=[b]Probleem:[/b] [newLine] Het blok verandert de grootte van de sprite niet. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok of pas het aan.
unnecessary_stop_script=[b]Probleem:[/b] [newLine] Er is een [sbi]stop [dit script v][/sbi] blok aan het einde van een script. Het blok is hier niet nodig, omdat het script toch aan het einde is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok om je code gemakkelijker leesbaar te maken.
unnecessary_think=[b]Probleem:[/b] [newLine] Je gebruikt een [sbi]denk ( ) ( ) sec.[/sbi] blok. Omdat de tijdwaarde op 0 staat, heeft het blok geen effect. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok of gebruik een geschikte tijdwaarde.
unnecessary_wait=[b]Probleem:[/b] [newLine] Je gebruikt een [sbi]wacht ( ) seconden[/sbi] blok. Omdat de tijdwaarde op 0 staat, heeft het blok geen effect. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok of gebruik een geschikte tijdwaarde.
unused_answer=[b]Probleem:[/b] [newLine] Het [sbi]vraag ( ) en wacht[/sbi] blok wordt gebruikt, maar het antwoord wordt nooit gebruikt. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik het [sbi](antwoord)[/sbi] in je project.
unused_custom_block=[b]Probleem:[/b] [newLine] Je hebt een eigen blok gemaakt dat je nooit in je project gebruikt. Dit maakt het project moeilijk leesbaar. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het eigen blok als je het niet nodig hebt.
unused_parameter=[b]Probleem:[/b] [newLine] Je hebt een parameter voor je eigen blok gemaakt, maar je gebruikt deze niet in het eigen blok. Dit maakt het eigen blok moeilijk leesbaar. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder de parameter als je deze niet nodig hebt.
unused_variables=[b]Probleem:[/b] [newLine] Je hebt een variabele [var]%VARIABLE[/var] gemaakt die je nooit gebruikt. Dit maakt het project moeilijk te begrijpen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder de variabele [var]%VARIABLE[/var] of gebruik de blokken [sbi]maak [%VARIABLE v] ( )[/sbi] of [sbi]verander [%VARIABLE v] met ( )[/sbi] in je project.
unused_variables_list=[b]Probleem:[/b] [newLine] Je hebt een lijst [var]%VARIABLE[/var] gemaakt die je nooit gebruikt. Dit maakt het project moeilijk te begrijpen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder de lijst [var]%VARIABLE[/var] of gebruik de blokken [sbi]voeg ( ) toe aan [%VARIABLE v][/sbi] of [sbi]voeg ( ) in op ( ) van [%VARIABLE v][/sbi] in je project.
used_variables=Goed! Je weet dat een variabele geïnitialiseerd moet worden voordat deze wordt gebruikt.
used_variables_list=Goed! Je weet dat een lijst geïnitialiseerd moet worden voordat deze wordt gebruikt.
useful_position_check=Goede aandacht! In Scratch zijn de waarden voor x- en y-coördinaten zeer nauwkeurige drijvende-kommawaarden. Een exacte [EQ] controle met deze getallen kan problemen veroorzaken. Om dat te voorkomen, heb je [LEQ] en [GEQ] operators gebruikt.
useless_wait=[b]Probleem:[/b] [newLine] Je hebt een [sbi]wacht () sec.[/sbi] blok gebruikt zonder enige volgende blokken in hetzelfde script. Daarom heeft het blok geen effect. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok of voeg meer blokken toe erna.
valid_termination=Super! Je hebt een stopvoorwaarde in je lus geïmplementeerd. Dit voorkomt dat de lus voor altijd blijft draaien.
variable_as_literal=[b]Probleem:[/b] [newLine] Je gebruikt de naam van een variabele als tekst. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Waarschijnlijk bedoelde je de variabele [var]%VARIABLE[/var]. Sleep het blok voor deze variabele in de sleuf.
variable_initialization_race=[b]Probleem:[/b] [newLine] Dezelfde variabele wordt in verschillende scripts geïnitialiseerd, steeds getriggerd door dezelfde gebeurtenis. Afhankelijk van hoe traag of snel de scripts worden uitgevoerd, kan het gedrag van je programma variëren. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Ken de waarde toe aan je variabele in slechts een van de scripts, of gebruik verschillende gebeurtenissen.
waiting_check_stop=Super! Je wacht op een voorwaarde om je programma te stoppen.
purpose_of_forever_loop=Leg het doel van deze lus uit.[a-f]
