comparing_literals_wait_true=[b]Probleem:[/b] [newLine] Je vergelijkt twee teksten waarbij het resultaat altijd [TRUE] is. De blokken na het [sbi]wacht tot < >[/sbi] blok zullen %ALWAYSNEVER uitgevoerd worden. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verander de vergelijking in iets zinvols of verwijder het controle blok.
comparing_literals_wait_variable=[b]Probleem:[/b] [newLine] De vergelijking zal altijd %TRUEFALSE%ADDINFODICT opleveren. Daardoor wordt de code na het [sbi]wacht tot < >[/sbi] blok %ALWAYSNEVER uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Was het de bedoeling om een variabele [var]%VARIABLE[/var] te gebruiken voor de vergelijking? Ga dan naar de variabelen tab om een variabele [var]%VARIABLE[/var] te maken. Sleep vervolgens het [var]%VARIABLE[/var] blok in het vergelijkingsvak.
comparing_literals_wait_variable_exists=[b]Probleem:[/b] [newLine] De vergelijking zal altijd %TRUEFALSE%ADDINFODICT opleveren. Daardoor wordt de code na het [sbi]wacht tot < >[/sbi] blok %ALWAYSNEVER uitgevoerd. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Was het de bedoeling om de variabele [var]%VARIABLE[/var] te gebruiken voor de vergelijking? Sleep dan het blok voor deze variabele in het vergelijkingsvak.
