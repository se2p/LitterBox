ambient_light_in_bounds=Netjes! Je gebruikt het omgevingslicht in het bereik van de sensor.
ambient_light_out_of_bounds=[b]Probleem:[/b] [newLine] Je probeert het omgevingslicht te meten in een bereik dat niet mogelijk is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een waarde tussen 0 en 100.
battery_level_in_bounds=Netjes! Je gebruikt het batterijniveau in het juiste bereik.
battery_level_out_of_bounds=[b]Probleem:[/b] [newLine] Je probeert het batterijniveau van de robot te meten in een bereik dat niet mogelijk is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een waarde tussen 0 en 100.
codey_upload_stop_timed=[b]Probleem:[/b] [newLine] Wanneer het [sbi]stop [alle v][/sbi] blok wordt uitgevoerd terwijl een tijdsgebonden blok draait, blijft dit blok uitgevoerd worden en wordt niet uitgeschakeld wanneer de tijd om is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg op een geschikt punt een stopblok toe voor de betreffende bron.
codey_upload_stop_timed_possible=[b]Probleem:[/b] [newLine] Deze code kan worden uitgevoerd in de uploadmodus. Als het [sbi]stop [alle v][/sbi] blok wordt uitgevoerd terwijl een tijdsgebonden blok draait, blijft dit blok uitgevoerd worden en wordt niet uitgeschakeld wanneer de tijd om is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg op een geschikt punt een stopblok toe voor de betreffende bron.
color_detection_in_bounds=Netjes! Je gebruikt de kleurwaarde in het bereik van de sensor.
color_detection_out_of_bounds=[b]Probleem:[/b] [newLine] Je probeert de kleurwaarde te meten in een bereik dat niet mogelijk is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een geheel getal tussen 0 en 255.
color_setting_in_bounds=Netjes! Je stelt de kleur in het juiste bereik in.
color_setting_out_of_bounds=[b]Probleem:[/b] [newLine] Je probeert de kleurwaarde in te stellen in een bereik dat niet mogelijk is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een geheel getal tussen 0 en 255.
detect_repeat_in_loop=[b]Probleem:[/b] [newLine] De meetwaarden worden gecontroleerd in een lus die geen [sbi]wacht tot < >[/sbi] blokken bevat. Omdat de lus heel snel wordt uitgevoerd, kan dit ertoe leiden dat de waarden meerdere keren worden gelezen. De code in de lus wordt dan meerdere keren uitgevoerd, wat misschien niet de bedoeling is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg [sbi]wacht tot < >[/sbi] blokken toe.
gear_potentiometer_in_bounds=Netjes! Je gebruikt de potentiometerwaarde van het tandwiel van de robot in het juiste bereik.
gear_potentiometer_out_of_bounds=[b]Probleem:[/b] [newLine] Je probeert de potentiometerwaarde van het tandwiel van de robot te meten in een bereik dat niet mogelijk is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een geheel getal tussen 0 en 100.
interrupted_loop_sensing_robot=[b]Probleem:[/b] [newLine] Het [sbi]%BLOCKNAME[/sbi] blok onderbreekt de controle van de voorwaarde in het [sbi]%THENELSE[/sbi] blok tijdens de uitvoering. Het kan gebeuren dat de voorwaarde optreedt, maar je script niet dienovereenkomstig reageert omdat het bezig is met het uitvoeren van het [sbi]%BLOCKNAME[/sbi] blok. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Indien mogelijk, controleer de voorwaarde in een [bc]apart script[/bc].
led_off_script=Netjes! Je hebt een script om alle LED's uit te schakelen.
led_off_script_missing=[b]Probleem:[/b] [newLine] De LED's kunnen worden ingeschakeld, maar er is geen script die ze weer uitschakelt. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg een script toe dat de LED's weer uitschakelt wanneer je ze niet meer nodig hebt.
line_following_in_bounds=Netjes! Je gebruikt de waarde van de lijnvolgsensor in het juiste bereik.
line_following_out_of_bounds=[b]Probleem:[/b] [newLine] Je probeert een waarde voor de lijnvolgsensor te meten die niet mogelijk is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een geheel getal tussen 0 en 3.
loop_sensing_robot=Goed gedaan! Je controleert continu op het optreden van een gebeurtenis in een herhaal-lus.
looped_statement_not_stopped=[b]Probleem:[/b] [newLine] Bronnen, zoals motoren of lampen, worden niet gestopt door hun respectievelijke stopstatement als het uitvoerende statement in een lus zit. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Hier is een stop alle statement nodig.
loudness_in_bounds=Netjes! Je gebruikt de waarde van de geluidssterktesensor in het juiste bereik.
loudness_out_of_bounds=[b]Probleem:[/b] [newLine] Je probeert de geluidssterkte te meten in een bereik dat niet mogelijk is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een waarde tussen 0 en 100.
matrix_off_script=Netjes! Je hebt een script om de LED-matrix uit te schakelen.
matrix_off_script_missing=[b]Probleem:[/b] [newLine] De LED-matrix kan worden ingeschakeld, maar er is geen script die deze weer uitschakelt. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg een script toe dat de LED-matrix weer uitschakelt wanneer je deze niet meer nodig hebt.
missing_loop_robot_sensing=[b]Probleem:[/b] [newLine] De voorwaarde wordt slechts één keer gecontroleerd in dit script. Daarom eindigt het script te snel. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Zet het voorwaardelijke statement in een [sbi]herhaal[/sbi] blok om de voorwaarde continu te controleren.
motor_low_power=[b]Probleem:[/b] [newLine] Het motorvermogen moet 50% of meer zijn, anders beweegt de robot niet betrouwbaar. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik waarden tussen 50 en 100.
motor_off_script=Netjes! Je hebt een script om de motoren uit te schakelen.
motor_power_in_bounds=Netjes! Je gebruikt een waarde voor het motorvermogen die in het juiste bereik ligt.
motor_power_minus=[b]Probleem:[/b] [newLine] Je gebruikt een negatief motorvermogen. Daarom beweegt de robot in de tegenovergestelde richting. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Om het programma gemakkelijker te begrijpen te maken, zou je het blok voor de betreffende richting moeten gebruiken en alleen positieve waarden gebruiken.
motor_power_out_of_bounds=[b]Probleem:[/b] [newLine] Je gebruikt een waarde voor het motorvermogen die niet mogelijk is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik alleen waarden tussen 0 en 100, aangezien het motorvermogen in procenten wordt gegeven.
motor_stop_script_missing=[b]Probleem:[/b] [newLine] De motor kan worden ingeschakeld, maar er is geen script om deze weer uit te schakelen. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg een script toe dat de motor weer uitschakelt wanneer je deze niet meer nodig hebt.
multiple_attribute_modifications_robot=[b]Probleem:[/b] [newLine] Er zijn meerdere wijzigingen aan dezelfde variabele of attribuut achter elkaar. Bij het uitvoeren van het programma heeft alleen de laatste wijziging zichtbare effecten. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Combineer de wijzigingen tot slechts één wijziging.
multiple_attribute_modifications_custom_robot=[b]Probleem:[/b] [newLine] Er zijn meerdere wijzigingen aan %VARIABLE achter elkaar. Bij het uitvoeren van het programma heeft alleen de laatste wijziging zichtbare effecten. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Combineer de wijzigingen tot slechts één wijziging.
parallel_board_launch_script=[b]Probleem:[/b] [newLine] MBots kunnen geen parallelle scripts uitvoeren in uploadmodus. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik livemodus of programmeer geen parallelle scripts.
parallel_resource_use=[b]Probleem:[/b] [newLine] Bronnen, zoals motoren of lampen, kunnen problemen veroorzaken wanneer ze worden bestuurd door parallelle scripts. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik niet dezelfde bronnen in parallelle scripts.
parallelisation_robot=Geweldig! Je start verschillende scripts bij dezelfde gebeurtenis. Je gebruikt dus het concept van parallellisatie.
pitch_angle_in_bounds=Netjes! Je gebruikt de waarde van de stamphoeksensor in het mogelijke bereik.
pitch_angle_out_of_bounds=[b]Probleem:[/b] [newLine] Je probeert de stamphoek van de robot te meten in een bereik dat niet mogelijk is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een geheel getal tussen -180 en 180.
responsive_loop_sensing=Deze lus controleert op invoer en reageert onmiddellijk zonder vertraging.
rocky_light_off_script=Netjes! Je hebt een script om het licht uit te schakelen.
rocky_light_off_script_missing=[b]Probleem:[/b] [newLine] Het licht kan worden ingeschakeld, maar er is geen script dat het weer uitschakelt. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Voeg een script toe dat het licht weer uitschakelt wanneer je het niet meer nodig hebt.
roll_angle_in_bounds=Netjes! Je gebruikt de waarde van de rolhoeksensor in het juiste bereik.
roll_angle_out_of_bounds=[b]Probleem:[/b] [newLine] Je probeert de rolhoek van de robot te meten in een bereik dat niet mogelijk is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een geheel getal tussen -90 en 90.
sensor_value_equals=[b]Probleem:[/b] [newLine] Sensorwaarden zijn meestal drijvende-kommagetallen. Het is onwaarschijnlijk dat een gemeten waarde exact gelijk is aan jouw waarde. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een benadering met [LEQ] of [GEQ] in plaats daarvan.
shaking_strength_in_bounds=Netjes! Je gebruikt de waarde van de schudsterktesensor in het juiste bereik.
shaking_strength_out_of_bounds=[b]Probleem:[/b] [newLine] Je probeert de schudsterkte te meten in een bereik dat niet mogelijk is. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een geheel getal tussen 0 en 100.
timed_statement_in_live_loop=[b]Probleem:[/b] [newLine] Wanneer een tijdsgebonden actie alleen in een lus wordt uitgevoerd, hapert deze in livemodus. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik de uploadmodus of bedenk een oplossing waarbij je de lus niet nodig hebt.
timed_statement_in_possible_live_loop=[b]Probleem:[/b] [newLine] Deze code kan worden uitgevoerd in livemodus. Wanneer een tijdsgebonden actie alleen in een lus wordt uitgevoerd, hapert deze in livemodus. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik de uploadmodus of bedenk een oplossing waarbij je de lus niet nodig hebt.
ultra_sonic_in_bounds=Netjes! Je gebruikt de waarde van de ultrasoonsensor in het juiste bereik.
ultra_sonic_out_of_bounds=[b]Probleem:[/b] [newLine] Je probeert een afstand te meten die niet kan worden gedetecteerd met de ultrasoonsensor. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Gebruik een waarde tussen 3cm en 400cm.
unnecessary_time_robot=[b]Probleem:[/b] [newLine] Je gebruikt een blok dat gedurende een bepaalde tijd wordt uitgevoerd. Omdat de tijdwaarde op 0 staat, heeft het blok geen effect. [newLine] [newLine] [b]Suggestie voor codeverbetering:[/b] [newLine] Verwijder het blok of gebruik een geschikte tijdwaarde.
